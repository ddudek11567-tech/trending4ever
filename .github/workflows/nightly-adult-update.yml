name: Nightly Adult Movie Update

on:
  schedule:
    # Run daily at 2 AM UTC (adjust timezone as needed)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-adult-movies:
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install ffmpeg
        run: |
          choco install ffmpeg -y
          refreshenv
          
      - name: Run nightly updater
        run: |
          node nightly_adult_updater.js
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adult-tv.html adult.html
          git diff --staged --quiet || git commit -m "Auto-update: Add new adult films ($(date))"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-update-log
          path: nightly_update.log