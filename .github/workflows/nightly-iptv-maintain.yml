name: Nightly IPTV Maintainer

on:
  schedule:
    # 05:00 UTC = 01:00 AM Eastern (01:00 ET)
    - cron: '0 5 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: iptv-nightly
  cancel-in-progress: false

jobs:
  maintain-iptv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run IPTV maintainer
        run: node nightly_iptv_maintainer.js

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-iptv-report
          path: |
            nightly_iptv_report.json
            nightly_iptv.log
          retention-days: 7