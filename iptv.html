    <meta charset="UTF-8">

    <!-- HLS.js for stream playback support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --red-status: #cf6679;
            --green-status: #03dac6;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* 1. Make the player stay fixed at the top */
        #player-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #000;
            width: 100%;
            max-height: 40vh;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            max-width: 900px;
            height: 350px;
            background: #000;
        }

        .content {
            padding: 20px;
        }

        h2.category-title {
            border-bottom: 2px solid var(--surface-color);
            padding-bottom: 5px;
            margin-top: 30px;
            text-transform: capitalize;
        }

        /* 2 & 3. Channels laid out horizontally and rows scroll vertically/horizontally */
        .channel-row {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding: 10px 0;
            scroll-behavior: smooth;
        }

        .channel-row::-webkit-scrollbar {
            height: 8px;
        }

        .channel-row::-webkit-scrollbar-thumb {
            background: var(--surface-color);
            border-radius: 4px;
        }

        .channel-card {
            flex: 0 0 160px;
            background: var(--surface-color);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .channel-card:hover {
            transform: scale(1.05);
        }

        .logo-wrapper {
            position: relative;
            width: 60px;
            height: 60px;
            margin: 0 auto 8px auto;
        }

        .channel-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            background: #333;
        }

        /* 4 & 5. Logo status indicators (Red = dead/untested, Green = working) */
        .status-indicator {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--surface-color);
            background-color: var(--red-status); /* Default red */
        }

        .channel-card.working .status-indicator {
            background-color: var(--green-status); /* Turns green if working */
        }

        .channel-name {
            font-size: 13px;
            word-break: break-word;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }
    </style>
</head>

        // Function to assign categories based on keywords
        function categorizeChannel(name) {
            name = name.toLowerCase();
            if (name.includes('news') || name.includes('weather') || name.includes('bloomberg') || name.includes('fox business')) return 'News & Weather';
            if (name.includes('sport') || name.includes('espn') || name.includes('nba') || name.includes('nfl') || name.includes('btn') || name.includes('mlb')) return 'Sports';
            if (name.includes('movie') || name.includes('cine') || name.includes('starz') || name.includes('hallmark') || name.includes('hbo') || name.includes('fx')) return 'Movies & Entertainment';
            if (name.includes('disney') || name.includes('nick') || name.includes('kids') || name.includes('baby') || name.includes('toon')) return 'Kids & Family';
            if (name.includes('docu') || name.includes('history') || name.includes('nat geo') || name.includes('smithsonian') || name.includes('48 hours')) return 'Documentary & History';
            if (name.includes('music') || name.includes('mtv') || name.includes('cmt') || name.includes('cmc')) return 'Music';
            if (name.includes('church') || name.includes('better life') || name.includes('cbn') || name.includes('daystar') || name.includes('word') || name.includes('faith')) return 'Religious';
            if (name.includes('detroit') || name.includes('hctv') || name.includes('can tv') || name.includes('derry') || name.includes('kpvm') || name.includes('beach tv')) return 'Local & Public Access';
            return 'General Entertainment';
        }

        // Parse M3U
        function parseM3U(data) {
            const lines = data.split('\n');
            let channels = [];
            let currentChannel = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const nameParts = line.split(',');
                    currentChannel.logo = logoMatch ? logoMatch[1] : '';
                    currentChannel.name = nameParts[nameParts.length - 1] || 'Unknown Channel';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        currentChannel.category = categorizeChannel(currentChannel.name);
                        channels.push({...currentChannel});
                    }
                    currentChannel = {};
                }
            }
            return channels;
        }

        const channels = parseM3U(rawPlaylist);

        // Group by category
        const groupedChannels = channels.reduce((acc, channel) => {
            if (!acc[channel.category]) acc[channel.category] = [];
            acc[channel.category].push(channel);
            return acc;
        }, {});

        const container = document.getElementById('categories-container');

        // Render UI
        for (const [category, chList] of Object.entries(groupedChannels)) {
            const section = document.createElement('div');
            section.innerHTML = `<h2 class="category-title">${category}</h2>`;
            
            const row = document.createElement('div');
            row.className = 'channel-row';

            chList.forEach((ch, index) => {
                const cardId = `card-${category.replace(/\s+/g, '')}-${index}`;
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.id = cardId;
                card.innerHTML = `
                    <div class="logo-wrapper">
                        <img class="channel-logo" src="${ch.logo || 'https://via.placeholder.com/60?text=TV'}" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/60?text=TV'">
                        <div class="status-indicator"></div>
                    </div>
                    <div class="channel-name">${ch.name}</div>
                `;

                card.addEventListener('click', () => playStream(ch.url));
                row.appendChild(card);

                // Test stream validity asynchronously
                testStream(ch.url, card);
            });

            section.appendChild(row);
            container.appendChild(section);
        }

        // Play stream function handling HLS and native elements
        function playStream(url) {
            const video = document.getElementById('videoElement');
            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (window.hls) window.hls.destroy();
                const hls = new Hls();
                window.hls = hls;
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else {
                video.src = url;
                video.play();
            }
        }

        // Background availability check (Turns logo green if reachable, stays red if not)
        async function testStream(url, cardElement) {
            try {
                // Using a light fetch or mode no-cors/head check simulation
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 4000);
                
                await fetch(url, { method: 'GET', mode: 'no-cors', signal: controller.signal });
                clearTimeout(timeoutId);
                
                // If no exception, mark as working (turns logo indicator green)
                cardElement.classList.add('working');
            } catch (e) {
                // Leaves default state (red indicator)
            }
        }
