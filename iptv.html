    <meta charset="UTF-8">

    <!-- HLS.js for stream playback support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-color: #0f0f0f;
            --surface-color: #1a1a1a;
            --surface-hover: #2a2a2a;
            --text-color: #f0f0f0;
            --text-secondary: #aaa;
            --accent-color: #3ea6ff;
            --green-status: #2ba640;
            --red-status: #ff4e45;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Sticky Video Player Header */
        #player-container {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: #000;
            width: 100%;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        video {
            width: 100%;
            max-width: 960px;
            height: 380px;
            background: #000;
            outline: none;
        }

        .dashboard-container {
            padding: 20px 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        h2.category-title {
            font-size: 1.25rem;
            border-bottom: 2px solid var(--surface-color);
            padding-bottom: 8px;
            margin-top: 40px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        /* Horizontal Scrolling Rows */
        .channel-row {
            display: flex;
            overflow-x: auto;
            gap: 16px;
            padding: 10px 4px 20px 4px;
            scroll-behavior: smooth;
        }

        .channel-row::-webkit-scrollbar {
            height: 10px;
        }

        .channel-row::-webkit-scrollbar-track {
            background: var(--surface-color);
            border-radius: 5px;
        }

        .channel-row::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 5px;
        }

        .channel-row::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Channel Card Layout */
        .channel-card {
            flex: 0 0 150px;
            background: var(--surface-color);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid transparent;
        }

        .channel-card:hover {
            background: var(--surface-hover);
            transform: translateY(-3px);
            border-color: #444;
        }

        .logo-wrapper {
            position: relative;
            width: 64px;
            height: 64px;
            margin: 0 auto 10px auto;
        }

        .channel-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            background: #222;
            padding: 4px;
        }

        .channel-name {
            font-size: 0.85rem;
            color: var(--text-color);
            line-height: 1.2;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            word-break: break-word;
        }
    </style>
</head>

        // Accurate Keyword Categorization
        function categorizeChannel(name) {
            const n = name.toLowerCase();
            if (n.includes('news') || n.includes('weather') || n.includes('bloomberg') || n.includes('accuweather')) return 'News & Weather';
            if (n.includes('sport') || n.includes('espn') || n.includes('nba') || n.includes('nfl') || n.includes('btn') || n.includes('draftkings')) return 'Sports';
            if (n.includes('movie') || n.includes('cine') || n.includes('starz') || n.includes('hallmark') || n.includes('axn') || n.includes('comedy central') || n.includes('e!') || n.includes('syfy') || n.includes('usa network') || n.includes('reelz')) return 'Movies & Entertainment';
            if (n.includes('disney') || n.includes('nick') || n.includes('kids') || n.includes('baby') || n.includes('freeform')) return 'Kids & Family';
            if (n.includes('docu') || n.includes('history') || n.includes('nat geo') || n.includes('48 hours') || n.includes('dateline') || n.includes('vice')) return 'Documentary & History';
            if (n.includes('music') || n.includes('mtv') || n.includes('cmt')) return 'Music';
            if (n.includes('beach tv') || n.includes('actv') || n.includes('ace tv') || n.includes('biz tv')) return 'Local & Public Access';
            return 'General Entertainment';
        }

        // Parse M3U Data
        function parseM3U(data) {
            const lines = data.split('\n');
            let channels = [];
            let currentChannel = {};

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const logoMatch = line.match(/tvg-logo="([^"]*)"/);
                    const nameParts = line.split(',');
                    currentChannel.logo = logoMatch ? logoMatch[1] : '';
                    currentChannel.name = nameParts[nameParts.length - 1] || 'Unknown Channel';
                } else if (line && !line.startsWith('#')) {
                    currentChannel.url = line;
                    if (currentChannel.name && currentChannel.url) {
                        currentChannel.category = categorizeChannel(currentChannel.name);
                        channels.push({...currentChannel});
                    }
                    currentChannel = {};
                }
            }
            return channels;
        }

        const channels = parseM3U(rawPlaylist);

        // Group channels by category
        const groupedChannels = channels.reduce((acc, channel) => {
            if (!acc[channel.category]) acc[channel.category] = [];
            acc[channel.category].push(channel);
            return acc;
        }, {});

        const container = document.getElementById('categories-container');

        // Render sections cleanly
        for (const [category, chList] of Object.entries(groupedChannels)) {
            const section = document.createElement('div');
            section.innerHTML = `<h2 class="category-title">${category}</h2>`;
            
            const row = document.createElement('div');
            row.className = 'channel-row';

            chList.forEach((ch) => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                card.innerHTML = `
                    <div class="logo-wrapper">
                        <img class="channel-logo" src="${ch.logo || 'https://via.placeholder.com/64?text=TV'}" alt="${ch.name}" onerror="this.src='https://via.placeholder.com/64?text=TV'">
                    </div>
                    <div class="channel-name">${ch.name}</div>
                `;

                card.addEventListener('click', () => playStream(ch.url));
                row.appendChild(card);
            });

            section.appendChild(row);
            container.appendChild(section);
        }

        // Stream player handler
        function playStream(url) {
            const video = document.getElementById('videoElement');
            if (Hls.isSupported() && url.includes('.m3u8')) {
                if (window.hls) {
                    window.hls.destroy();
                }
                const hls = new Hls();
                window.hls = hls;
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay prevented:", e));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        switch(data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                console.error("A network error occurred:", data);
                                hls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                console.error("A media error occurred:", data);
                                hls.recoverMediaError();
                                break;
                            default:
                                hls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay prevented:", e));
                });
            } else {
                video.src = url;
                video.play().catch(e => console.log("Autoplay prevented:", e));
            }
        }
