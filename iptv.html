        let currentChannel = channels[0];
        let hlsInstance = null;
        let isEmbedMode = false;

        document.addEventListener('DOMContentLoaded', () => {
            try { document.getElementById('channelCount').innerText = channels.length; } catch (e) {}
            try { renderGenreRows(channels); } catch (e) {}
            try { selectChannel(channels[0]); } catch (e) {}
        });

        function renderGenreRows(list) {
            const container = document.getElementById('genreRowsContainer');
            container.innerHTML = '';

            // Group channels by category
            const categories = {};
            list.forEach(ch => {
                if (!categories[ch.category]) categories[ch.category] = [];
                categories[ch.category].push(ch);
            });

            for (const [category, chs] of Object.entries(categories)) {
                const section = document.createElement('div');
                section.className = "space-y-2.5";
                
                section.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h4 class="text-xs font-extrabold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                            <span class="w-1.5 h-1.5 rounded-full bg-pink-500"></span>
                            ${category} <span class="text-[10px] text-slate-500 font-normal">(${chs.length})</span>
                        </h4>
                    </div>
                    <div class="grid grid-flow-col auto-cols-[160px] sm:auto-cols-[180px] gap-3 overflow-x-auto custom-scrollbar pb-2" id="row-${category.replace(/[^a-zA-Z0-9]/g, '')}"></div>
                `;
                container.appendChild(section);

                const rowGrid = section.querySelector('div[id^="row-"]');
                chs.forEach(ch => {
                    const isSelected = currentChannel && currentChannel.name === ch.name;
                    const card = document.createElement('div');
                    card.onclick = () => selectChannel(ch);
                    card.className = `p-3 rounded-xl border cursor-pointer transition-all flex flex-col justify-between h-24 shrink-0 ${
                        isSelected
                            ? 'bg-red-600/20 border-red-500 shadow-lg shadow-red-950/50 text-white'
                            : 'bg-[#0d1326]/80 border-slate-800/80 hover:border-slate-700 hover:bg-[#131b35] text-slate-300'
                    }`;
                    
                    // Logo color indicator: Green if working, Red if not working
                    const statusColorClass = ch.working ? 'bg-green-500 shadow-green-500/50' : 'bg-red-500 shadow-red-500/50';

                    card.innerHTML = `
                        <div class="flex items-center justify-between">
                            <span class="text-xl">${ch.icon}</span>
                            <span class="w-2.5 h-2.5 rounded-full shadow-md ${statusColorClass}" title="${ch.working ? 'Working Channel' : 'Offline / Unverified'}"></span>
                        </div>
                        <div>
                            <div class="text-xs font-bold truncate">${ch.name}</div>
                            <div class="text-[10px] text-slate-400 truncate mt-0.5">${ch.category}</div>
                        </div>
                    `;
                    rowGrid.appendChild(card);
                });
            }
        }

        function filterChannels(query) {
            const q = query.toLowerCase();
            const filtered = channels.filter(c => c.name.toLowerCase().includes(q) || c.category.toLowerCase().includes(q));
            renderGenreRows(filtered);
            document.getElementById('channelCount').innerText = filtered.length;
        }

        function selectChannel(ch) {
            currentChannel = ch;
            document.getElementById('currentChannelName').innerText = ch.name;
            document.getElementById('currentChannelSub').innerText = `Now viewing: ${ch.category} · Master Stream Feed`;
            document.getElementById('activeChannelIcon').innerText = ch.icon;
            document.getElementById('epgChannelTag').innerText = ch.name.toUpperCase();
            
            loadPlayerEngine();
            renderGenreRows(channels);
        }

        function loadPlayerEngine() {
            const container = document.getElementById('playerContainer');
            
            if (isEmbedMode) {
                container.innerHTML = `
                    <iframe 
                        src="${currentChannel.url}" 
                        class="w-full h-full absolute inset-0 border-0 bg-black" 
                        allow="autoplay; fullscreen; encrypted-media" 
                        playsinline>
                    </iframe>
                `;
            } else {
                container.innerHTML = `
                    <video
                        id="videoPlayer"
                        class="w-full h-full absolute inset-0 object-contain bg-black"
                        controls
                        autoplay
                        playsinline
                    ></video>
                `;

                const video = document.getElementById('videoPlayer');
                const targetStream = currentChannel.url;

                if (Hls.isSupported()) {
                    if (hlsInstance) {
                        hlsInstance.destroy();
                    }
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(targetStream);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(e => console.log("Autoplay prevented:", e));
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = targetStream;
                    video.addEventListener('loadedmetadata', () => {
                        video.play().catch(e => console.log("Autoplay prevented:", e));
                    });
                }
            }
        }

        function toggleEmbedMode() {
            isEmbedMode = !isEmbedMode;
            const btn = document.getElementById('modeToggleBtn');
            if (isEmbedMode) {
                btn.className = "px-2.5 py-1.5 rounded-lg bg-pink-600/20 border border-pink-500/40 hover:bg-pink-600/40 text-pink-300 text-[11px] font-semibold transition-all";
                btn.innerText = "🔄 Native Mode";
            } else {
                btn.className = "px-2.5 py-1.5 rounded-lg bg-indigo-600/20 border border-indigo-500/40 hover:bg-indigo-600/40 text-indigo-300 text-[11px] font-semibold transition-all";
                btn.innerText = "🔄 Embed Mode";
            }
            loadPlayerEngine();
        }

        function toggleFavorite() {
            const btn = document.getElementById('favBtn');
            if (btn.classList.contains('text-red-400')) {
                btn.className = "px-3 py-1.5 rounded-lg bg-[#161f38] border border-slate-700/60 hover:border-pink-500 text-[11px] font-semibold transition-all";
                btn.innerHTML = '🤍 Favorite';
            } else {
                btn.className = "px-3 py-1.5 rounded-lg bg-red-600/20 border border-red-500 text-red-400 text-[11px] font-semibold transition-all shadow-lg";
                btn.innerHTML = '❤️ Favorited';
            }
        }
