    <!-- Aether Video Player Overlay Modal -->
    <div class="player fixed inset-0 z-[100] bg-black hidden items-center justify-center opacity-0 transition-opacity duration-300" id="player" style="display:none;">
        <div class="stage relative w-[min(100vw,calc(100vh*16/9))] aspect-[16/9] bg-black shadow-[0_0_120px_rgba(0,0,0,0.8)]" id="stage">

            <div class="titlebar absolute top-0 left-0 right-0 p-[20px_24px_40px] bg-gradient-to-b from-black/80 to-transparent flex justify-between items-start gap-4 opacity-0 transition-opacity duration-300 z-10">

                    <p id="pMeta" class="text-[12px] text-slate-300 mt-[3px]"></p>
                </div>
                <button class="ctrl close-x bg-white/10 border border-white/10 w-[38px] h-[38px] rounded-[10px] backdrop-blur cursor-pointer text-white flex items-center justify-center" id="closeBtn" title="Close (Esc)">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="controls absolute left-0 right-0 bottom-0 p-[16px_24px_18px] bg-gradient-to-t from-black/92 to-transparent opacity-0 transition-opacity duration-300 z-10">
                <input type="range" class="seek w-full appearance-none h-[5px] rounded-[5px] bg-[linear-gradient(to_right,var(--accent)_var(--p,0%),rgba(255,255,255,.22)_var(--p,0%))] cursor-pointer outline-none" id="seek" min="0" max="1000" value="0" step="1">

                <div class="btnrow flex items-center gap-[18px] mt-[6px]">
                    <button class="ctrl bg-transparent border-0 text-white cursor-pointer grid place-items-center p-1 transition-all hover:text-[var(--accent)]" id="ppBtn" title="Play / Pause (k)">
                        <svg id="ppIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>

                    <div class="vol flex items-center gap-2">

                    <button class="ctrl bg-transparent border-0 text-white cursor-pointer grid place-items-center p-1 transition-all hover:text-[var(--accent)]" id="fsBtn" title="Fullscreen (f)">

                    </button>

b": "107,107,107", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4", "cats": ["documentary"]}, {"id": 149, "title": "Harlan County, USA", "year": 1976, "genreKey": "documentary", "genreLabel": "Documentary", "poster": "https://image.tmdb.org/t/p/w500/d9d9d9d9d9d9d9d9d9d9d9d9d9d9.jpg", "accent": "#6b6b6b", "rgb": "107,107,107", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4", "cats": ["documentary"]}, {"id": 150, "title": "The Times of Harvey Milk", "year": 1984, "genreKey": "documentary", "genreLabel": "Documentary", "poster": "https://image.tmdb.org/t/p/w500/e0e0e0e0e0e0e0e0e0e0e0e0e0e0.jpg", "accent": "#6b6b6b", "rgb": "107,107,107", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/VolkswagenGTIReview.mp4", "cats": ["documentary"]}];
const ROWS=[{"key": "action", "label": "Action (1976–1989)"}, {"key": "scifi", "label": "Sci-Fi (1976–1989)"}, {"key": "horror", "label": "Horror (1976–1989)"}, {"key": "drama", "label": "Drama (1976–1989)"}, {"key": "thriller", "label": "Thriller (1976–1989)"}, {"key": "comedy", "label": "Comedy (1976–1989)"}, {"key": "romance", "label": "Romance (1976–1989)"}, {"key": "animation", "label": "Animation (1976–1989)"}, {"key": "documentary", "label": "Documentary (1976–1989)"}];
const SPOTLIGHT_IDS=[1, 21, 41, 61, 81, 101, 121, 131, 141];

        let saved = new Set(JSON.parse(localStorage.getItem("aether_saved") || "[]"));
        let activeIdx = 0, rotTimer = null;

        const backdropsEl = document.getElementById('backdrops');
        const heroContentEl = document.getElementById('heroContent');
        const dotsEl = document.getElementById('dots');
        const collectionEl = document.getElementById('collection');

        function renderHero() {
            backdropsEl.innerHTML = '';
            dotsEl.innerHTML = '';
            SPOTLIGHT_IDS.forEach((id, i) => {
                const f = FILMS.find(x => x.id === id);
                const bd = document.createElement('div');
                bd.className = `bd ${i === 0 ? 'active' : ''}`;
                bd.style.background = `radial-gradient(circle at 32% 22%, rgba(${f.rgb},.45), transparent 60%), linear-gradient(160deg, rgba(${f.rgb},.28), #060608 78%)`;
                bd.innerHTML = `<img src="${f.poster}" alt="${f.title}" class="absolute inset-0 w-full h-full object-cover opacity-25 filter blur-sm">`;
                backdropsEl.appendChild(bd);

                const dot = document.createElement('button');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dot.onclick = () => setSpotlight(i);
                dotsEl.appendChild(dot);
            });
            updateHeroContent(0);
            startRot();
        }

        function updateHeroContent(idx) {
            activeIdx = idx;
            const f = FILMS.find(x => x.id === SPOTLIGHT_IDS[idx]);
            document.documentElement.style.setProperty('--accent', f.accent);
            document.documentElement.style.setProperty('--accent-rgb', f.rgb);

            document.querySelectorAll('.bd').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));

            heroContentEl.classList.add('switching');
            setTimeout(() => {
                heroContentEl.innerHTML = `
                    <div class="eyebrow">${f.genreLabel} Feature</div>
                    <h2 class="hero-title">${f.title.split(' ').map((w, wi) => wi === 1 ? `<em>${w}</em>` : w).join(' ')}</h2>
                    <div class="hero-meta">
                        <span class="rating-pill">${f.genreLabel}</span>
                        <span class="sep"></span>
                        <span>${f.year}</span>
                    </div>
                    <div class="hero-actions">
                        <button class="btn-play" onclick="playFilm(${f.id})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play Film
                        </button>
                        <button class="btn-ghost" onclick="toggleSave(${f.id})">
                            ${saved.has(f.id) ? '✓ In Saved List' : '+ Add to List'}
                        </button>
                    </div>
                `;
                heroContentEl.classList.remove('switching');
            }, 220);
        }

        function setSpotlight(idx) {
            stopRot();
            updateHeroContent(idx);
            startRot();
        }

        function startRot() {
            stopRot();
            rotTimer = setInterval(() => {
                activeIdx = (activeIdx + 1) % SPOTLIGHT_IDS.length;
                updateHeroContent(activeIdx);
            }, 8000);
        }

        function stopRot() {
            if (rotTimer) clearInterval(rotTimer);
        }

        window.playFilm = function (id) {
            const f = FILMS.find(x => x.id === id);
            if (!f) return;
            openPlayer(f);
        };

        window.toggleSave = function (id) {
            if (saved.has(id)) saved.delete(id); else saved.add(id);
            localStorage.setItem("aether_saved", JSON.stringify([...saved]));
            renderCollection();
            renderHero();
            showToast(saved.has(id) ? 'Added to your saved list' : 'Removed from your list');
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>${msg}`;
            t.classList.add('opacity-100');
            setTimeout(() => t.classList.remove('opacity-100'), 2600);
        }

        function renderCollection() {
            collectionEl.innerHTML = '';
            ROWS.forEach((r, ri) => {
                let list = FILMS.filter(f => f.cats.includes(r.key));
                if (list.length === 0) return;

                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `
                    <div class="row-head">
                        <h3 class="row-title"><span class="num">${String(ri + 1).padStart(2, '0')}.</span> ${r.label}</h3>
                        <span class="row-count text-xs text-slate-500">${list.length} films</span>
                    </div>
                    <div class="row-track" id="track-${r.key}"></div>
                `;
                const track = row.querySelector('.row-track');
                list.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = (e) => {
                        if (e.target.closest('.bookmark')) return;
                        playFilm(f.id);
                    };

                    const isSaved = saved.has(f.id);
                    card.innerHTML = `
                        <div class="card-img" style="background:linear-gradient(160deg, rgba(${f.rgb},.55), #0b0b10 80%)">
                            <img src="${f.poster}" alt="${f.title}" class="w-full h-full object-cover">
                        </div>
                        <div class="card-scrim"></div>
                        <div class="card-top">
                            <span class="badge year">${f.year}</span>
                            <button class="bookmark ${isSaved ? 'saved' : ''}" onclick="toggleSave(${f.id})" title="Save">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                            </button>
                        </div>
                        <div class="card-play">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                        <div class="card-info">
                            <h3>${f.title}</h3>
                            <p>${f.genreLabel}</p>
                        </div>
                    `;
                    track.appendChild(card);
                });
                collectionEl.appendChild(row);
            });
        }

        // Player setup
        const playerEl = document.getElementById('player');
        const videoEl = document.getElementById('video');
        const loaderEl = document.getElementById('loader');
        const stageEl = document.getElementById('stage');
        const seekEl = document.getElementById('seek');
        const curTimeEl = document.getElementById('curTime');
        const durTimeEl = document.getElementById('durTime');
        const ppBtn = document.getElementById('ppBtn');
        const ppIcon = document.getElementById('ppIcon');
        const muteBtn = document.getElementById('muteBtn');
        const volEl = document.getElementById('vol');
        const fsBtn = document.getElementById('fsBtn');

        function openPlayer(f) {
            playerEl.style.display = 'flex';
            setTimeout(() => playerEl.classList.add('opacity-100'), 10);
            document.getElementById('pTitle').innerText = f.title;
            document.getElementById('pMeta').innerText = `${f.genreLabel} · ${f.year}`;
            videoEl.src = f.video;
            videoEl.play().catch(() => {});
            setupUI();
        }

        function closePlayer() {
            videoEl.pause();
            videoEl.src = "";
            playerEl.classList.remove('opacity-100');
            setTimeout(() => playerEl.style.display = 'none', 300);
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        }

        document.getElementById('closeBtn').onclick = closePlayer;

        ppBtn.onclick = () => {
            if (videoEl.paused) videoEl.play(); else videoEl.pause();
        };

        muteBtn.onclick = () => {
            videoEl.muted = !videoEl.muted;
            volEl.value = videoEl.muted ? 0 : (videoEl.volume * 100);
        };

        fsBtn.onclick = () => {
            if (!document.fullscreenElement) stageEl.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        };

        function setupUI() {
            videoEl.onwaiting = () => loaderEl.style.display = 'flex';
            videoEl.onplaying = () => loaderEl.style.display = 'none';
            videoEl.ontimeupdate = () => {
                if (!videoEl.duration) return;
                const p = (videoEl.currentTime / videoEl.duration) * 1000;
                seekEl.value = p;
                curTimeEl.innerText = fmtTime(videoEl.currentTime);
                durTimeEl.innerText = fmtTime(videoEl.duration);
            };
            videoEl.onplay = () => ppIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            videoEl.onpause = () => ppIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }

        function fmtTime(s) {
            if (!isFinite(s)) return "0:00";
            s = Math.floor(s);
            const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
            return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
        }

        seekEl.oninput = (e) => {
            if (!videoEl.duration) return;
            videoEl.currentTime = (e.target.value / 1000) * videoEl.duration;
        };

        document.addEventListener('DOMContentLoaded', () => {
            try { renderHero(); } catch (e) { console.error('Hero render failed:', e); }
            try { renderCollection(); } catch (e) { console.error('Collection render failed:', e); }
        });
    </script>
</body>
</html>
