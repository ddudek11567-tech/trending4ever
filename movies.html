    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #060913; }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        .aether-cinema-root { position: relative; }
        .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at center, transparent 40%, rgba(0,0,0,0.8) 100%); z-index: 2; }
        .grain { position: absolute; inset: 0; pointer-events: none; opacity: 0.03; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E"); z-index: 3; }

        .aether-hero { position: relative; width: 100%; height: 520px; display: flex; align-items: flex-end; overflow: hidden; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .backdrops { position: absolute; inset: 0; z-index: 1; }
        .bd { position: absolute; inset: 0; opacity: 0; transition: opacity 0.8s ease-in-out; display: flex; align-items: center; justify-content: flex-end; padding-right: 10%; }
        .bd.active { opacity: 1; }
        .bd-icon { font-size: 14rem; opacity: 0.15; filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5)); user-select: none; }
        
        .glow { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
        .blob { position: absolute; filter: blur(80px); opacity: 0.4; border-radius: 50%; }
        .blob.a { width: 300px; height: 300px; background: var(--accent, #db2777); top: -50px; left: -50px; }
        .blob.b { width: 400px; height: 400px; background: #4f46e5; bottom: -100px; right: 10%; }
        
        .scrim { position: absolute; inset: 0; z-index: 3; background: linear-gradient(0deg, #060913 0%, rgba(6,9,19,0.8) 30%, transparent 100%), linear-gradient(90deg, #060913 15%, rgba(6,9,19,0.6) 50%, transparent 100%); pointer-events: none; }
        
        .hero-content { position: relative; z-index: 4; padding: 0 4rem 3rem 4rem; max-width: 800px; transition: transform 0.3s ease, opacity 0.3s ease; }
        .hero-content.switching { opacity: 0; transform: translateY(10px); }
        .eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent, #f472b6); margin-bottom: 0.75rem; background: rgba(255,255,255,0.05); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); }
        .hero-title { font-family: 'Playfair Display', serif; font-size: 3.25rem; font-weight: 800; line-height: 1.1; color: #fff; margin-bottom: 1rem; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .hero-title em { font-style: italic; color: var(--accent, #f472b6); }
        .hero-meta { display: flex; align-items: center; gap: 1rem; font-size: 0.875rem; color: #94a3b8; margin-bottom: 1.5rem; font-weight: 500; }
        .rating-pill { background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 4px; color: #fff; font-size: 0.75rem; font-weight: 700; }
        .sep { width: 4px; height: 4px; border-radius: 50%; background: #475569; }
        
        .hero-actions { display: flex; align-items: center; gap: 1rem; }
        .btn-play { background: #fff; color: #060913; font-weight: 700; padding: 0.75rem 1.75rem; border-radius: 12px; display: flex; align-items: center; gap: 8px; transition: all 0.2s; box-shadow: 0 4px 20px rgba(255,255,255,0.2); cursor: pointer; border: none; }
        .btn-play:hover { background: var(--accent, #f472b6); color: #fff; transform: translateY(-2px); }
        .btn-ghost { background: rgba(255,255,255,0.08); color: #fff; font-weight: 600; padding: 0.75rem 1.5rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(10px); transition: all 0.2s; cursor: pointer; }
        .btn-ghost:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); transform: translateY(-2px); }

        .dots { position: absolute; right: 3rem; bottom: 3rem; z-index: 5; display: flex; flex-direction: column; gap: 8px; }
        .dot { width: 8px; height: 24px; border-radius: 4px; background: rgba(255,255,255,0.2); border: none; cursor: pointer; transition: all 0.3s; }
        .dot.active { background: var(--accent, #f472b6); height: 36px; box-shadow: 0 0 10px var(--accent, #f472b6); }

        .collection { padding: 3rem 4rem; display: flex; flex-direction: column; gap: 3rem; z-index: 4; position: relative; }
        .row { display: flex; flex-direction: column; gap: 1rem; }
        .row-head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 0.75rem; }
        .row-title { font-size: 1.25rem; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 0.5s; font-family: 'Playfair Display', serif; }
        .row-title .num { color: #64748b; font-size: 0.875rem; font-family: 'Inter', sans-serif; font-weight: 600; }
        
        .row-track { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 1.5rem; width: 100%; }
        
        .card { position: relative; height: 280px; border-radius: 16px; overflow: hidden; background: #0f172a; border: 1px solid rgba(255,255,255,0.06); cursor: pointer; transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); display: flex; flex-direction: column; justify-content: flex-end; }
        .card:hover { transform: translateY(-6px); box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 20px rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); }
        .card-img { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: transform 0.5s; }
        .card:hover .card-img { transform: scale(1.05); }
        .card-icon { font-size: 5rem; opacity: 0.35; user-select: none; }
        .card-scrim { position: absolute; inset: 0; background: linear-gradient(0deg, #060913 0%, rgba(6,9,19,0.8) 40%, transparent 100%); pointer-events: none; }
        
        .card-top { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 2; }
        .badge { background: rgba(0,0,0,0.6); backdrop-blur: blur(8px); border: 1px solid rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; color: #cbd5e1; }
        .bookmark { background: rgba(0,0,0,0.6); backdrop-blur: blur(8px); border: 1px solid rgba(255,255,255,0.1); width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #cbd5e1; cursor: pointer; transition: all 0.2s; }
        .bookmark:hover, .bookmark.saved { background: #f472b6; color: #fff; border-color: #f472b6; }

        .card-play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; opacity: 0; background: rgba(6,9,19,0.4); backdrop-filter: blur(2px); transition: opacity 0.2s; z-index: 2; }
        .card:hover .card-play { opacity: 1; }
        .card-play svg { width: 48px; height: 48px; background: #fff; color: #060913; padding: 12px; border-radius: 50%; box-shadow: 0 4px 20px rgba(0,0,0,0.5); transform: scale(0.8); transition: transform 0.2s; }

        .card-info { position: relative; z-index: 2; padding: 16px; }

        .card-info p { font-size: 0.75rem; color: #94a3b8; font-weight: 500; }

    {"id": 213, "title": "The Silence of the Lambs", "year": 1991, "genreKey": "thriller", "genreLabel": "Thriller", "icon": "🔪", "accent": "#8a5a0a", "rgb": "138,90,10", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/VolkswagenGTIReview.mp4", "cats": ["thriller"]},

    {"id": 215, "title": "Dumb and Dumber", "year": 1994, "genreKey": "comedy", "genreLabel": "Comedy", "icon": "😂", "accent": "#c9a23c", "rgb": "201,162,60", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4", "cats": ["comedy"]},
    {"id": 216, "title": "Groundhog Day", "year": 1993, "genreKey": "comedy", "genreLabel": "Comedy", "icon": "😂", "accent": "#c9a23c", "rgb": "201,162,60", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4", "cats": ["comedy"]},
    {"id": 217, "title": "The Big Lebowski", "year": 1998, "genreKey": "comedy", "genreLabel": "Comedy", "icon": "😂", "accent": "#c9a23c", "rgb": "201,162,60", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4", "cats": ["comedy"]},
    {"id": 218, "title": "Pretty Woman", "year": 1990, "genreKey": "romance", "genreLabel": "Romance", "icon": "❤️", "accent": "#c8546b", "rgb": "200,84,107", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4", "cats": ["romance"]},
    {"id": 219, "title": "Ghost", "year": 1990, "genreKey": "romance", "genreLabel": "Romance", "icon": "❤️", "accent": "#c8546b", "rgb": "200,84,107", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4", "cats": ["romance"]},
    {"id": 220, "title": "Jerry Maguire", "year": 1996, "genreKey": "romance", "genreLabel": "Romance", "icon": "❤️", "accent": "#c8546b", "rgb": "200,84,107", "video": "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4", "cats": ["romance"]}
];

const ROWS = [
    {"key": "action", "label": "Action Master List"},
    {"key": "scifi", "label": "Sci-Fi Master List"},
    {"key": "horror", "label": "Horror Master List"},
    {"key": "drama", "label": "Drama Master List"},
    {"key": "thriller", "label": "Thriller Master List"},
    {"key": "comedy", "label": "Comedy Master List"},
    {"key": "romance", "label": "Romance Master List"},
    {"key": "animation", "label": "Animation Master List"},
    {"key": "documentary", "label": "Documentary Master List"}
];

const SPOTLIGHT_IDS = [201, 202, 204, 206, 208, 212, 215, 218, 1];

        let saved = new Set(JSON.parse(localStorage.getItem("aether_saved") || "[]"));
        let activeIdx = 0, rotTimer = null;

        const backdropsEl = document.getElementById('backdrops');
        const heroContentEl = document.getElementById('heroContent');
        const dotsEl = document.getElementById('dots');
        const collectionEl = document.getElementById('collection');

        function renderHero() {
            backdropsEl.innerHTML = '';
            dotsEl.innerHTML = '';
            SPOTLIGHT_IDS.forEach((id, i) => {
                const f = FILMS.find(x => x.id === id);
                if (!f) return;
                const bd = document.createElement('div');
                bd.className = `bd ${i === 0 ? 'active' : ''}`;
                bd.style.background = `radial-gradient(circle at 32% 22%, rgba(${f.rgb},.45), transparent 60%), linear-gradient(160deg, rgba(${f.rgb},.28), #060608 78%)`;
                bd.innerHTML = `<span class="bd-icon">${f.icon}</span>`;
                backdropsEl.appendChild(bd);

                const dot = document.createElement('button');
                dot.className = `dot ${i === 0 ? 'active' : ''}`;
                dot.onclick = () => setSpotlight(i);
                dotsEl.appendChild(dot);
            });
            updateHeroContent(0);
            startRot();
        }

        function updateHeroContent(idx) {
            activeIdx = idx;
            const f = FILMS.find(x => x.id === SPOTLIGHT_IDS[idx]);
            if (!f) return;
            document.documentElement.style.setProperty('--accent', f.accent);
            document.documentElement.style.setProperty('--accent-rgb', f.rgb);

            document.querySelectorAll('.bd').forEach((b, i) => b.classList.toggle('active', i === idx));
            document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === idx));

            heroContentEl.classList.add('switching');
            setTimeout(() => {
                heroContentEl.innerHTML = `
                    <div class="eyebrow">${f.icon} ${f.genreLabel} Feature</div>
                    <h2 class="hero-title">${f.title.split(' ').map((w, wi) => wi === 1 ? `<em>${w}</em>` : w).join(' ')}</h2>
                    <div class="hero-meta">
                        <span class="rating-pill">${f.genreLabel}</span>
                        <span class="sep"></span>
                        <span>${f.year}</span>
                    </div>
                    <div class="hero-actions">
                        <button class="btn-play" onclick="playFilm(${f.id})">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Play Film
                        </button>
                        <button class="btn-ghost" onclick="toggleSave(${f.id})">
                            ${saved.has(f.id) ? '✓ In Saved List' : '+ Add to List'}
                        </button>
                    </div>
                `;
                heroContentEl.classList.remove('switching');
            }, 220);
        }

        function setSpotlight(idx) {
            stopRot();
            updateHeroContent(idx);
            startRot();
        }

        function startRot() {
            stopRot();
            rotTimer = setInterval(() => {
                activeIdx = (activeIdx + 1) % SPOTLIGHT_IDS.length;
                updateHeroContent(activeIdx);
            }, 8000);
        }

        function stopRot() {
            if (rotTimer) clearInterval(rotTimer);
        }

        window.playFilm = function (id) {
            const f = FILMS.find(x => x.id === id);
            if (!f) return;
            openPlayer(f);
        };

        window.toggleSave = function (id) {
            if (saved.has(id)) saved.delete(id); else saved.add(id);
            localStorage.setItem("aether_saved", JSON.stringify([...saved]));
            renderCollection();
            renderHero();
            showToast(saved.has(id) ? 'Added to your saved list' : 'Removed from your list');
        };

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>${msg}`;
            t.classList.add('opacity-100');
            setTimeout(() => t.classList.remove('opacity-100'), 2600);
        }

        function renderCollection() {
            collectionEl.innerHTML = '';
            ROWS.forEach((r, ri) => {
                let list = FILMS.filter(f => f.cats.includes(r.key));
                if (list.length === 0) return;

                const row = document.createElement('div');
                row.className = 'row';
                row.innerHTML = `
                    <div class="row-head">
                        <h3 class="row-title"><span class="num">${String(ri + 1).padStart(2, '0')}.</span> ${r.label}</h3>
                        <span class="row-count text-xs text-slate-500">${list.length} films</span>
                    </div>
                    <div class="row-track" id="track-${r.key}"></div>
                `;
                const track = row.querySelector('.row-track');
                list.forEach(f => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = (e) => {
                        if (e.target.closest('.bookmark')) return;
                        playFilm(f.id);
                    };

                    const isSaved = saved.has(f.id);
                    card.innerHTML = `
                        <div class="card-img" style="background:linear-gradient(160deg, rgba(${f.rgb},.55), #0b0b10 80%)">
                            <span class="card-icon">${f.icon}</span>
                        </div>
                        <div class="card-scrim"></div>
                        <div class="card-top">
                            <span class="badge year">${f.year}</span>
                            <button class="bookmark ${isSaved ? 'saved' : ''}" onclick="toggleSave(${f.id})" title="Save">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="${isSaved ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
                            </button>
                        </div>
                        <div class="card-play">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                        </div>
                        <div class="card-info">
                            <h3>${f.title}</h3>
                            <p>${f.genreLabel}</p>
                        </div>
                    `;
                    track.appendChild(card);
                });
                collectionEl.appendChild(row);
            });
        }

        // Player setup
        const playerEl = document.getElementById('player');
        const videoEl = document.getElementById('video');
        const loaderEl = document.getElementById('loader');
        const stageEl = document.getElementById('stage');
        const seekEl = document.getElementById('seek');
        const curTimeEl = document.getElementById('curTime');
        const durTimeEl = document.getElementById('durTime');
        const ppBtn = document.getElementById('ppBtn');
        const ppIcon = document.getElementById('ppIcon');
        const muteBtn = document.getElementById('muteBtn');
        const volEl = document.getElementById('vol');
        const fsBtn = document.getElementById('fsBtn');

        function openPlayer(f) {
            playerEl.style.display = 'flex';
            setTimeout(() => playerEl.classList.add('opacity-100'), 10);
            document.getElementById('pTitle').innerText = f.title;
            document.getElementById('pMeta').innerText = `${f.genreLabel} · ${f.year}`;
            videoEl.src = f.video;
            videoEl.play().catch(() => {});
            setupUI();
        }

        function closePlayer() {
            videoEl.pause();
            videoEl.src = "";
            playerEl.classList.remove('opacity-100');
            setTimeout(() => playerEl.style.display = 'none', 300);
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        }

        document.getElementById('closeBtn').onclick = closePlayer;

        ppBtn.onclick = () => {
            if (videoEl.paused) videoEl.play(); else videoEl.pause();
        };

        muteBtn.onclick = () => {
            videoEl.muted = !videoEl.muted;
            volEl.value = videoEl.muted ? 0 : (videoEl.volume * 100);
        };

        fsBtn.onclick = () => {
            if (!document.fullscreenElement) stageEl.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        };

        function setupUI() {
            videoEl.onwaiting = () => loaderEl.style.display = 'flex';
            videoEl.onplaying = () => loaderEl.style.display = 'none';
            videoEl.ontimeupdate = () => {
                if (!videoEl.duration) return;
                const p = (videoEl.currentTime / videoEl.duration) * 1000;
                seekEl.value = p;
                curTimeEl.innerText = fmtTime(videoEl.currentTime);
                durTimeEl.innerText = fmtTime(videoEl.duration);
            };
            videoEl.onplay = () => ppIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            videoEl.onpause = () => ppIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        }

        function fmtTime(s) {
            if (!isFinite(s)) return "0:00";
            s = Math.floor(s);
            const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
            return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
        }

        seekEl.oninput = (e) => {
            if (!videoEl.duration) return;
            videoEl.currentTime = (e.target.value / 1000) * videoEl.duration;
        };

        document.addEventListener('DOMContentLoaded', () => {
            try { renderHero(); } catch (e) { console.error('Hero render failed:', e); }
            try { renderCollection(); } catch (e) { console.error('Collection render failed:', e); }
        });
    </script>
</body>
</html>
