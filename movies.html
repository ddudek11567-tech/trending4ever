        function cleanTitle(url) {
            let filename = url.split('/').pop();
            return filename.replace('.mp4', '').replace(/\./g, ' ');
        }

        function initList() {
            const listContainer = document.getElementById('list');
            mediaLinks.forEach(link => {
                let title = cleanTitle(link);
                let itemDiv = document.createElement('div');
                itemDiv.className = 'movie-item';
                itemDiv.innerText = title;
                itemDiv.onclick = () => playMedia(link, title);
                listContainer.appendChild(itemDiv);
            });
        }

        function playMedia(url, title) {
            document.getElementById('now-playing').innerText = title;
            var player = document.getElementById('videoPlayer');
            player.src = url;
            player.load();
            player.play();
        }

        window.onload = initList;
    </script>
