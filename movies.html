        function updateHeroContent(idx) {

            document.documentElement.style.setProperty('--accent', f.accent);
            document.documentElement.style.setProperty('--accent-rgb', f.rgb);

            document.getElementById('pTitle').innerText = f.title;
            document.getElementById('pMeta').innerText = `${f.genreLabel} · ${f.year}`;
            videoEl.src = f.video;
            videoEl.play().catch(() => {});
            setupUI();
        }

        function closePlayer() {
            videoEl.pause();
            videoEl.src = "";
            playerEl.classList.remove('opacity-100');
            setTimeout(() => playerEl.style.display = 'none', 300);
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        }

        document.getElementById('closeBtn').onclick = closePlayer;

        ppBtn.onclick = () => {
            if (videoEl.paused) videoEl.play(); else videoEl.pause();
        };

        muteBtn.onclick = () => {
            videoEl.muted = !videoEl.muted;
            volEl.value = videoEl.muted ? 0 : (videoEl.volume * 100);
        };

        fsBtn.onclick = () => {
            if (!document.fullscreenElement) stageEl.requestFullscreen().catch(() => {});
            else document.exitFullscreen().catch(() => {});
        };

        const centerPad = document.getElementById('centerPad');
        const cpBtn = document.getElementById('cpBtn');
        const cpIcon = document.getElementById('cpIcon');
        let padHideTimer = null;

        function padState() {
            const paused = videoEl.paused;
            cpIcon.innerHTML = paused ? '<path d="M8 5v14l11-7z"/>' : '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
            cpBtn.className = 'ctrl grid place-items-center w-16 h-16 rounded-full bg-black/45 border border-white/15 backdrop-blur transition-all hover:scale-105 cursor-pointer ' + (paused ? 'text-[#22c55e]' : 'text-[#facc15]');
        }

        function showPad() {
            clearTimeout(padHideTimer);
            centerPad.style.opacity = '1';
            centerPad.style.pointerEvents = 'auto';
            padState();
        }

        function hidePad() {
            clearTimeout(padHideTimer);
            centerPad.style.opacity = '0';
            centerPad.style.pointerEvents = 'none';
        }

        cpBtn.onclick = (e) => {
            e.stopPropagation();
            if (videoEl.paused) videoEl.play(); else videoEl.pause();
        };

        document.getElementById('cbBtn').onclick = (e) => {
            e.stopPropagation();
            videoEl.currentTime = Math.max(0, videoEl.currentTime - 10);
            showPad();
        };

        document.getElementById('cfBtn').onclick = (e) => {
            e.stopPropagation();
            videoEl.currentTime = Math.min(videoEl.duration || videoEl.currentTime, videoEl.currentTime + 10);
            showPad();
        };

        stageEl.onclick = () => {
            if (videoEl.paused) { videoEl.play(); }
            else { videoEl.pause(); showPad(); }
        };

        function setupUI() {
            videoEl.onwaiting = () => loaderEl.style.display = 'flex';
            videoEl.onplaying = () => loaderEl.style.display = 'none';
            videoEl.ontimeupdate = () => {
                if (!videoEl.duration) return;
                const p = (videoEl.currentTime / videoEl.duration) * 1000;
                seekEl.value = p;
                curTimeEl.innerText = fmtTime(videoEl.currentTime);
                durTimeEl.innerText = fmtTime(videoEl.duration);
            };
            videoEl.onplay = () => {
                ppIcon.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
                padState();
                padHideTimer = setTimeout(hidePad, 2600);
            };
            videoEl.onpause = () => {
                ppIcon.innerHTML = '<path d="M8 5v14l11-7z"/>';
                showPad();
            };
        }

        function fmtTime(s) {
            if (!isFinite(s)) return "0:00";
            s = Math.floor(s);
            const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
            return h ? `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}` : `${m}:${String(sec).padStart(2, '0')}`;
        }

        seekEl.oninput = (e) => {
            if (!videoEl.duration) return;
            videoEl.currentTime = (e.target.value / 1000) * videoEl.duration;
        };

        document.addEventListener('DOMContentLoaded', () => {
            try { renderHero(); } catch (e) { console.error('Hero render failed:', e); }
            try { renderCollection(); } catch (e) { console.error('Collection render failed:', e); }
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { document.getElementById('cbBtn').click(); e.preventDefault(); }
            if (e.key === 'ArrowRight') { document.getElementById('cfBtn').click(); e.preventDefault(); }
        });
    </script>
</body>
</html>
