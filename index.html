<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Channels</title>

    <!-- Professional font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: #0f0f13;
            color: #e8e8e8;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            text-align: center;
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.5px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #888888;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* ---------- VIDEO PLAYER ---------- */
        .player-section {
            max-width: 1000px;
            margin: 0 auto 30px;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            position: relative;
        }

        .player-section video {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border: none;
        }

        .player-status {
            position: absolute;
            bottom: 10px;
            left: 12px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            pointer-events: none;
            z-index: 2;
        }

        /* ---------- CHANNEL GRID ---------- */
        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .channel-card {
            background: #1c1c22;
            border-radius: 14px;
            padding: 20px 12px;
            text-align: center;
            text-decoration: none;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .channel-card:hover {
            transform: translateY(-5px);
            background: #282830;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .channel-card:active {
            transform: translateY(-2px);
        }

        .channel-logo {
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 12px;
            margin-bottom: 12px;
            background: #fff;
            padding: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .channel-card:hover .channel-logo {
            transform: scale(1.05);
        }

        .channel-name {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.3;
            word-break: break-word;
            color: #f0f0f0;
        }

        .channel-quality {
            font-size: 0.7rem;
            color: #7a7a85;
            margin-top: 4px;
            font-weight: 400;
        }

        /* ---------- LOADING / ERROR STATUS ---------- */
        .status-text {
            font-size: 14px;
            color: #ffa500;
            padding: 4px 0;
            text-align: center;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .channel-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }

            .channel-logo {
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>
<body>

    <h1>📺 Live Channels</h1>
    <p class="subtitle">Click a channel logo to start watching</p>

    <!-- Video Player -->
    <div class="player-section">
        <video id="liveStream" controls autoplay muted></video>
        <div class="player-status" id="playerStatus">Loading stream...</div>
    </div>

    <!-- Channel Grid -->
    <div class="channel-grid">

        <!-- Kutonen -->
        <a href="https://live-fi.tvkaista.net/kutonen/live.m3u8?src=freetv"
           class="channel-card"
           onclick="event.preventDefault(); loadStream(this.href, 'Kutonen');">
            <img src="https://ui-avatars.com/api/?name=Kutonen&background=FF6A00&color=fff&size=128"
                 alt="Kutonen" class="channel-logo">
            <span class="channel-name">Kutonen</span>
            <span class="channel-quality">720p</span>
        </a>

        <!-- TLC Finland -->
        <a href="https://live-fi.tvkaista.net/tlc/live.m3u8?src=freetv"
           class="channel-card"
           onclick="event.preventDefault(); loadStream(this.href, 'TLC Finland');">
            <img src="https://ui-avatars.com/api/?name=TLC&background=E9004C&color=fff&size=128"
                 alt="TLC Finland" class="channel-logo">
            <span class="channel-name">TLC Finland</span>
            <span class="channel-quality">720p</span>
        </a>

        <!-- Star Channel Finland -->
        <a href="https://live-fi.tvkaista.net/star-channel/live.m3u8?src=freetv"
           class="channel-card"
           onclick="event.preventDefault(); loadStream(this.href, 'Star Channel Finland');">
            <img src="https://ui-avatars.com/api/?name=Star&background=0047AB&color=fff&size=128"
                 alt="Star Channel Finland" class="channel-logo">
            <span class="channel-name">Star Channel Finland</span>
            <span class="channel-quality">720p</span>
        </a>

        <!-- MTV Ava -->
        <a href="https://live-fi.tvkaista.net/ava/live.m3u8?src=freetv"
           class="channel-card"
           onclick="event.preventDefault(); loadStream(this.href, 'MTV Ava');">
            <img src="https://ui-avatars.com/api/?name=Ava&background=00A859&color=fff&size=128"
                 alt="MTV Ava" class="channel-logo">
            <span class="channel-name">MTV Ava</span>
            <span class="channel-quality">720p</span>
        </a>

        <!-- Hero -->
        <a href="https://live-fi.tvkaista.net/hero/live.m3u8?src=freetv"
           class="channel-card"
           onclick="event.preventDefault(); loadStream(this.href, 'Hero');">
            <img src="https://ui-avatars.com/api/?name=Hero&background=E67E22&color=fff&size=128"
                 alt="Hero" class="channel-logo">
            <span class="channel-name">Hero</span>
            <span class="channel-quality">720p</span>
        </a>

        <!-- 3ABN Canada -->
        <a href="https://3abn.bozztv.com/3abncanada/3ABN/master.m3u8"
           class="channel-card"
           onclick="event.preventDefault(); loadStream(this.href, '3ABN Canada');">
            <img src="https://ui-avatars.com/api/?name=3ABN+Canada&background=7D3C98&color=fff&size=128"
                 alt="3ABN Canada" class="channel-logo">
            <span class="channel-name">3ABN Canada</span>
            <span class="channel-quality">720p</span>
        </a>

        <!-- 5AAB TV -->
        <a href="http://158.69.124.9:1935/5aabtv/5aabtv/playlist.m3u8"
           class="channel-card"
           onclick="event.preventDefault(); loadStream(this.href, '5AAB TV');">
            <img src="https://ui-avatars.com/api/?name=5AAB+TV&background=2980B9&color=fff&size=128"
                 alt="5AAB TV" class="channel-logo">
            <span class="channel-name">5AAB TV</span>
            <span class="channel-quality">720p</span>
        </a>

    </div>

    <!-- HLS.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <script>
        const video = document.getElementById('liveStream');
        const statusEl = document.getElementById('playerStatus');
        let currentHls = null;

        // Default stream on page load
        const DEFAULT_URL = "https://rtmp-live-ingest-ap-northeast-2-universe-dacast-com.akamaized.net/transmuxv1/streams/f08fcd45-1d04-9a8c-39ca-f56091820e5c.m3u8";

        function setStatus(text) {
            statusEl.textContent = text;
        }

        // Load / switch stream
        function loadStream(url, channelName) {
            setStatus(`Loading: ${channelName || 'stream'}...`);

            // Destroy previous HLS instance
            if (currentHls) {
                currentHls.destroy();
                currentHls = null;
            }

            // Clear native src if any
            video.removeAttribute('src');

            if (Hls.isSupported()) {
                const hls = new Hls({
                    enableWorker: true,
                    lowLatencyMode: true
                });
                currentHls = hls;
                hls.loadSource(url);
                hls.attachMedia(video);

                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    video.play().catch(() => {
                        // Autoplay blocked – show controls
                        video.muted = true;
                        video.play().catch(() => {});
                    });
                    setStatus(`Now playing: ${channelName || 'live stream'}`);
                });

                hls.on(Hls.Events.ERROR, function(event, data) {
                    if (data.fatal) {
                        setStatus('Error – stream unavailable');
                    }
                });

            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                // Native HLS support (Safari)
                video.src = url;
                video.addEventListener('loadedmetadata', function() {
                    video.play().catch(() => {});
                    setStatus(`Now playing: ${channelName || 'live stream'}`);
                });
            } else {
                setStatus('HLS is not supported in this browser');
            }
        }

        // Load the default stream initially
        window.addEventListener('DOMContentLoaded', function() {
            loadStream(DEFAULT_URL, 'Default stream');
        });
    </script>

</body>
</html>
