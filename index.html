<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Guide & Plasma Player</title>
  
  <!-- HLS and DASH libraries for video playback -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    :root {
      --card-bg: rgba(17, 22, 34, 0.75);
      --accent: #00f0ff;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    /* Fixed Viewport Layout with Single Seamless Milky Way Background */
    html, body {
      height: 100vh;
      overflow: hidden;
      background-color: #020408;
      color: var(--text-main);
      background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=2000&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    /* Top Search Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 2rem;
      background: rgba(2, 4, 8, 0.8);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      height: 60px;
    }

    .brand {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
      text-shadow: 0 2px 10px rgba(0, 240, 255, 0.3);
    }

    .brand span { color: var(--accent); }

    .search-input {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 0.4rem 1rem;
      color: #fff;
      font-size: 0.85rem;
      width: 240px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--accent);
      width: 280px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.25);
    }

    /* Active Player Section Locked in View */
    .top-player-section {
      padding: 0.6rem 2rem 0.4rem 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: rgba(2, 4, 8, 0.4);
      backdrop-filter: blur(8px);
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.3rem;
      width: 100%;
      max-width: 900px;
    }

    .player-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .player-title::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff66;
    }

    /* Compact Plasma TV Frame */
    .plasma-tv-frame {
      width: 100%;
      max-width: 900px;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      border-radius: 12px;
      padding: 8px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 
        0 15px 30px rgba(0, 0, 0, 0.9),
        0 0 25px rgba(0, 240, 255, 0.15),
        inset 0 0 15px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .screen-container {
      position: relative;
      width: 100%;
      background: #050505;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #111;
    }

    video {
      width: 100%;
      height: 310px;
      object-fit: cover;
      display: block;
      background: #000;
    }

    .tv-stand {
      width: 100px;
      height: 6px;
      background: linear-gradient(180deg, #334155 0%, #0f172a 100%);
      margin: 0 auto;
      border-radius: 0 0 4px 4px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.8);
      position: relative;
    }
    
    .tv-stand::after {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    /* Scrollable Content Container for Channels */
    .content-container {
      padding: 0 2rem 5rem 2rem;
      margin-top: 0.5rem;
      max-width: 940px;
      margin-left: auto;
      margin-right: auto;
      height: calc(100vh - 460px);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }

    .content-container::-webkit-scrollbar { width: 6px; }
    .content-container::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 3px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin: 1rem 0 0.5rem 0;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 12px;
      background: var(--accent);
      border-radius: 2px;
    }

    .channels-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 0.7rem;
    }

    /* Smaller, Professional Styled Channel Cards */
    .channel-card {
      height: 78px;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 8px;
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 0.5rem 0.7rem;
      overflow: hidden;
      text-decoration: none;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
    }

    .channel-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    .channel-card:hover {
      transform: translateY(-2px) scale(1.02);
      border-color: var(--accent);
      background: rgba(22, 30, 46, 0.85);
      box-shadow: 0 6px 20px rgba(0, 240, 255, 0.25);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }

    .channel-logo-text {
      font-size: 0.8rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
      text-transform: uppercase;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Custom professional branding hints per channel family */
    .channel-card[data-brand="syfy"] .channel-logo-text { color: #00ffcc; font-style: italic; letter-spacing: 1px; }
    .channel-card[data-brand="hbo"] .channel-logo-text { font-family: serif; letter-spacing: 2px; }
    .channel-card[data-brand="espn"] .channel-logo-text { color: #ff2222; font-weight: 900; font-style: italic; }
    .channel-card[data-brand="discovery"] .channel-logo-text { color: #38bdf8; }
    .channel-card[data-brand="hallmark"] .channel-logo-text { color: #f472b6; font-family: serif; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }

    .badge-res {
      background: rgba(0, 240, 255, 0.12);
      color: var(--accent);
      padding: 0.05rem 0.3rem;
      border-radius: 3px;
      font-size: 0.58rem;
      font-weight: 700;
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .tag-format {
      font-size: 0.55rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">SMART<span>CAST</span></div>
    <input type="text" id="searchInput" class="search-input" placeholder="Search live channels..." oninput="filterChannels()">
  </header>

  <!-- High-Tech Plasma TV Active Player Section (Fixed Viewport) -->
  <div class="top-player-section">
    <div class="player-header">
      <div id="playerTitle" class="player-title">Streaming Live: Kutonen (720p)</div>
    </div>
    <div class="plasma-tv-frame" id="plasmaTvFrame">
      <div class="screen-container">
        <video id="videoPlayer" controls autoplay></video>
      </div>
    </div>
    <div class="tv-stand"></div>
  </div>

  <!-- Scrollable Channel List Container -->
  <div class="content-container">
    <div id="categoryContainer"></div>
  </div>

<script>
  const channels = [
    { name: "Kutonen", category: "International", res: "720p", format: "m3u8", url: "https://live-fi.tvkaista.net/kutonen/live.m3u8?src=freetv", brand: "kutonen" },
    { name: "SYFY", category: "Entertainment & Movies", res: "1080p", format: "m3u8", url: "https://gpuserver5.tier1streams.com/SYFY/index.m3u8", brand: "syfy" },
    { name: "Nick Jr.", category: "Kids & Family", res: "720p", format: "m3u8", url: "https://jmp2.uk/plu-5ca6748a37b88b269472dad9.m3u8", brand: "nick" },
    { name: "Discovery Turbo", category: "Sports & Outdoors", res: "1080p", format: "m3u8", url: "https://gpuserver3.tier1streams.com/MOTORTREND/index.m3u8", brand: "discovery" },
    { name: "Hallmark Movies", category: "Entertainment & Movies", res: "1080p", format: "m3u8", url: "https://dbrb49pjoymg4.cloudfront.net/v1/master/3fec3e5cac39a52b2132f9c66c83dae043dc17d4/prod_default_xumo-ams-aws/master.m3u8?ads.xumo_channelId=99991709", brand: "hallmark" },
    { name: "Xumo Movies", category: "Entertainment & Movies", res: "1080p", format: "m3u8", url: "https://dbrb49pjoymg4.cloudfront.net/v1/master/3fec3e5cac39a52b2132f9c66c83dae043dc17d4/prod_default_xumo-ams-aws/master.m3u8?ads.xumo_channelId=99991709", brand: "xumo" },
    { name: "TLC Finland", category: "International", res: "720p", format: "m3u8", url: "https://live-fi.tvkaista.net/tlc/live.m3u8?src=freetv", brand: "tlc" },
    { name: "Star Channel", category: "International", res: "720p", format: "m3u8", url: "https://live-fi.tvkaista.net/star-channel/live.m3u8?src=freetv", brand: "star" },
    { name: "MTV Ava", category: "International", res: "720p", format: "m3u8", url: "https://live-fi.tvkaista.net/ava/live.m3u8?src=freetv", brand: "mtv" },
    { name: "Hero", category: "International", res: "720p", format: "m3u8", url: "https://live-fi.tvkaista.net/hero/live.m3u8?src=freetv", brand: "hero" },
    { name: "5AAB TV", category: "International", res: "720p", format: "m3u8", url: "http://158.69.124.9:1935/5aabtv/5aabtv/playlist.m3u8", brand: "5aab" },
    { name: "48 Hours", category: "Entertainment & Movies", res: "Live", format: "m3u8", url: "https://jmp2.uk/plu-62e925bc68d18a00077bb990.m3u8", brand: "cbs" },
    { name: "A&E", category: "Entertainment & Movies", res: "1080p", format: "m3u8", url: "https://gpuserver3.tier1streams.com/AE/index.m3u8", brand: "ae" },
    { name: "Animation+", category: "Kids & Family", res: "1080p", format: "m3u8", url: "https://pb-ioe9d0fpkd6pp.akamaized.net/playlist.m3u8", brand: "animation" },
    { name: "Autentic History", category: "Documentary & Lifestyle", res: "1080p", format: "m3u8", url: "https://9e754fa707344ccca6d84955c8fcaf36.mediatailor.us-east-1.amazonaws.com/v1/master/44f73ba4d03e9607dcd9bebdcb8494d86964f1d8/RlaxxTV-eu_AutenticHistory/playlist.m3u8", brand: "autentic" },
    { name: "BNN Bloomberg", category: "News & Regional", res: "Live", format: "mpd", url: "https://pe-ak-lp01a-9c9media.akamaized.net/live/News1BNNDigi/p/dash/00000001/1bba52dc66e4c68e/manifest.mpd", brand: "bnn" },
    { name: "Bonanza", category: "Entertainment & Movies", res: "Live", format: "m3u8", url: "https://jmp2.uk/plu-696e647b07ea70192d49f6a5.m3u8", brand: "classic" },
    { name: "Cable 14 Hamilton", category: "News & Regional", res: "Live", format: "m3u8", url: "https://flowcaster1-ch.cdn.clearcable.net/C14/smil:C14.smil/playlist.m3u8", brand: "cable14" },
    { name: "CBC News", category: "News & Regional", res: "1080p", format: "m3u8", url: "https://d2ny9lo79ujali.cloudfront.net/CBC_News_International.m3u8", brand: "cbc" },
    { name: "CHCH-DT", category: "News & Regional", res: "720p", format: "m3u8", url: "http://185.246.209.113/CHCHHD/index.m3u8", brand: "chch" },
    { name: "Cheers", category: "Entertainment & Movies", res: "Live", format: "m3u8", url: "https://jmp2.uk/plu-62bdb7f0db2eb30007376d4d.m3u8", brand: "paramount" },
    { name: "CityNews Toronto", category: "News & Regional", res: "720p", format: "m3u8", url: "https://citynewsregional.akamaized.net/hls/live/1024052/Regional_Live_7/master.m3u8", brand: "citynews" },
    { name: "Comedy Central", category: "Entertainment & Movies", res: "Live", format: "m3u8", url: "https://jmp2.uk/plu-64f8a408bd341e000818fcda.m3u8", brand: "comedy" },
    { name: "Cottage Life", category: "Documentary & Lifestyle", res: "720p", format: "m3u8", url: "http://185.246.209.113/CottageLife/index.m3u8", brand: "cottage" },
    { name: "Cowboy Channel", category: "Sports & Outdoors", res: "1080p", format: "m3u8", url: "https://amg17292-amg17292c1-distrotv-us-4170.playouts.now.amagi.tv/playlist/amg17292-tetonridgellc-tetonridgefast-distrotvus/playlist.m3u8", brand: "cowboy" },
    { name: "CP24", category: "News & Regional", res: "576p", format: "m3u8", url: "https://trs1.aynaott.com/cp24/index.m3u8", brand: "cp24" },
    { name: "CPAC", category: "News & Regional", res: "720p", format: "m3u8", url: "https://d7z3qjdsxbwoq.cloudfront.net/groupa/live/f9809cea-1e07-47cd-a94d-2ddd3e1351db/live.isml/.m3u8", brand: "cpac" },
    { name: "Golf Channel", category: "Sports & Outdoors", res: "1080p", format: "m3u8", url: "https://gpuserver3.tier1streams.com/GOLF_CHANNEL/index.m3u8", brand: "golf" },
    { name: "Home Network", category: "Documentary & Lifestyle", res: "720p", format: "m3u8", url: "http://40.160.24.53/HGTV/index.m3u8", brand: "hgtv" },
    { name: "I Love Lucy", category: "Entertainment & Movies", res: "Live", format: "m3u8", url: "https://jmp2.uk/plu-63a2f1dda0d69700078b7cba.m3u8", brand: "paramount" }
  ];

  let hlsPlayer = null;
  let dashPlayer = null;

  function renderInterface(filteredChannels) {
    const container = document.getElementById('categoryContainer');
    container.innerHTML = '';

    const categories = [...new Set(channels.map(c => c.category))];

    categories.forEach(cat => {
      const catChannels = filteredChannels.filter(c => c.category === cat);
      if (catChannels.length === 0) return;

      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.innerText = cat;

      const grid = document.createElement('div');
      grid.className = 'channels-grid';

      catChannels.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        if (ch.brand) card.setAttribute('data-brand', ch.brand);
        card.onclick = () => playChannel(ch);
        card.innerHTML = `
          <div class="card-top">
            <div class="channel-logo-text">${ch.name}</div>
          </div>
          <div class="card-footer">
            <span class="badge-res">${ch.res}</span>
            <span class="tag-format">${ch.format}</span>
          </div>
        `;
        grid.appendChild(card);
      });

      container.appendChild(sectionTitle);
      container.appendChild(grid);
    });

    if (container.children.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--text-sub);">No channels found matching your search.</div>`;
    }
  }

  function playChannel(channel) {
    const video = document.getElementById('videoPlayer');
    const title = document.getElementById('playerTitle');

    title.innerText = `Streaming Live: ${channel.name} (${channel.res})`;

    if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
    if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }

    if (channel.format === 'm3u8') {
      if (Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(channel.url);
        hlsPlayer.attachMedia(video);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.play();
      }
    } else if (channel.format === 'mpd') {
      dashPlayer = dashjs.MediaPlayer().create();
      dashPlayer.initialize(video, channel.url, true);
    } else {
      video.src = channel.url;
      video.play();
    }
  }

  function filterChannels() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = channels.filter(c => c.name.toLowerCase().includes(query));
    renderInterface(filtered);
  }

  renderInterface(channels);

  window.addEventListener('DOMContentLoaded', () => {
    playChannel(channels[0]);
  });
</script>

</body>
</html>
