<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS TV // Live Stream Suite & Media Center</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- HLS.js for m3u8 stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome for professional logos and icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Dash.js for mpd stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/dashjs/4.7.4/dash.all.min.js"></script>
    <!-- Google Fonts for Aether Cinema styling -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&display=swap" rel="stylesheet">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.6);
            border-radius: 3px;
        }

        /* Mobile Performance Optimizations */
        @media (max-width: 768px) {
            .grain, .glow { display: none !important; }
            * { -webkit-tap-highlight-color: transparent; }
        }

        :root{
            --aether-bg:#060608;
            --accent:#c8a86b;
            --accent-rgb:200,168,107;
            --text:#f4f1ec;
            --muted:rgba(244,241,236,.62);
            --faint:rgba(244,241,236,.4);
            --line:rgba(244,241,236,.09);
        }

        .aether-cinema-root {
            background: var(--aether-bg);
            color: var(--text);
            font-family: 'Inter', system-ui, sans-serif;
            position: relative;
            width: 100%;
            min-height: 100%;
        }

        .vignette{position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(120% 100% at 50% 40%,transparent 55%,rgba(0,0,0,.55) 100%);}

        .aether-hero{position:relative;height:75vh;width:100%;overflow:hidden}
        .backdrops{position:absolute;inset:0}
        .bd{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 0.8s ease;filter:saturate(.92) contrast(1.05) brightness(.82)}
        .bd.active{opacity:1}
        
        .scrim{position:absolute;inset:0;z-index:2;background:
            linear-gradient(90deg,rgba(6,6,8,.94) 0%,rgba(6,6,8,.7) 26%,rgba(6,6,8,.12) 58%,rgba(6,6,8,.35) 100%),
            linear-gradient(0deg,rgba(6,6,8,1) 1%,rgba(6,6,8,0) 42%)}
        .hero-content{position:absolute;left:0;right:0;bottom:10vh;padding:0 5vw;max-width:720px;z-index:4;transition:opacity .3s ease}
        .hero-content.switching{opacity:0}
        .eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:12px}
        .hero-title{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(28px,5vw,64px);line-height:1.05;letter-spacing:-.015em}
        .hero-title em{font-style:italic;color:var(--accent)}
        .hero-meta{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:14px;font-weight:500}
        .hero-meta .sep{width:3px;height:3px;border-radius:50%;background:var(--faint)}
        .match{color:#7fd29a;font-weight:700}
        .rating-pill{color:var(--accent);font-weight:700}
        .hero-synopsis{color:var(--muted);font-size:14px;line-height:1.5;margin-top:12px;max-width:540px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .hero-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
        .btn-play{background:var(--accent);color:#0a0a0c;padding:10px 20px;border-radius:8px;font-weight:600;display:flex;align-items:center;gap:8px}
        .btn-ghost{background:rgba(255,255,255,.07);color:#fff;border:1px solid var(--line);padding:10px 20px;border-radius:8px;font-weight:600}
        .dots{position:absolute;right:5vw;bottom:10vh;display:flex;gap:6px;z-index:4}
        .dot{width:20px;height:3px;border-radius:3px;background:rgba(255,255,255,.22);cursor:pointer;border:0;padding:0}
        .dot.active{background:var(--accent);width:36px}

        .collection{position:relative;z-index:2;padding:5vh 0 4vh}
        .row{position:relative;margin-bottom:36px}
        .row-head{display:flex;align-items:baseline;gap:14px;padding:0 5vw;margin-bottom:12px}
        .row-title{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--text);display:flex;align-items:center;gap:10px}
        .row-title .num{font-family:'Playfair Display',serif;font-style:italic;color:var(--accent);font-size:14px}
        .row-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 5vw 16px;scrollbar-width:none}
        .row-track::-webkit-scrollbar{display:none}

        .card{flex:0 0 auto;width:clamp(200px, 42vw, 300px);aspect-ratio:16/9;position:relative;border-radius:12px;overflow:hidden;cursor:pointer;background:#0c0c11;border:1px solid var(--line);scroll-snap-align:start}
        .card-img{position:absolute;inset:0;background-size:cover;background-position:center}
        .card-scrim{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,6,8,0) 30%,rgba(6,6,8,.6) 68%,rgba(6,6,8,.95) 100%)}
        .card-top{position:absolute;top:8px;left:8px;right:8px;display:flex;align-items:center;gap:6px;z-index:3}
        .badge{font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(0,0,0,.6);font-weight:600}
        .badge.rating{color:var(--accent)}
        .badge.match{color:#7fd29a}
        .bookmark{margin-left:auto;width:28px;height:28px;border-radius:8px;background:rgba(0,0,0,.6);color:#cfcfcf;display:grid;place-items:center;cursor:pointer}
        .card-info{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;z-index:3}
        .card-info h3{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .card-info p{font-size:10.5px;color:var(--muted);margin-top:2px}
        .progress{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.2);z-index:3}
        .progress span{display:block;height:100%;background:var(--accent)}
    </style>
</head>
<body class="min-h-screen bg-[#060913] text-slate-100 flex flex-col md:flex-row font-sans selection:bg-pink-600 selection:text-white overflow-x-hidden">

    <!-- Sidebar Navigation -->
    <aside class="w-full md:w-64 bg-[#0a0f1d] border-b md:border-b-0 md:border-r border-slate-800/60 flex flex-col justify-between shrink-0 select-none z-30">
        <div>
            <!-- Logo Header -->
            <div class="p-4 md:p-6 flex items-center space-x-3 border-b border-slate-800/40">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-pink-600 via-purple-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-pink-600/20 text-white font-black text-lg">
                    ⚡
                </div>
                <div>
                    <h1 class="font-extrabold tracking-wider text-base md:text-lg text-white flex items-center gap-1.5">
                        NEXUS<span class="text-pink-500">TV</span>
                    </h1>
                    <span class="text-[9px] text-slate-400 font-bold tracking-widest uppercase">v4.3 &bull; QUANTUM</span>
                </div>
            </div>

            <!-- Navigation Links -->
            <nav class="p-3 md:p-4 flex md:block overflow-x-auto gap-2 md:space-y-1.5 custom-scrollbar">
                <button onclick="switchPage('iptv')" id="navIptv" class="flex-shrink-0 md:w-full flex items-center justify-between px-3 md:px-4 py-2.5 rounded-xl text-xs md:text-sm font-semibold transition-all text-slate-400 hover:text-slate-200 hover:bg-slate-800/40">
                    <div class="flex items-center space-x-2 md:space-x-3">
                        <span>📡</span>
                        <span>Live IPTV</span>
                    </div>
                </button>

                <button onclick="switchPage('movies')" id="navMovies" class="flex-shrink-0 md:w-full flex items-center justify-between px-3 md:px-4 py-2.5 rounded-xl text-xs md:text-sm font-semibold transition-all bg-gradient-to-r from-cyan-600/20 to-blue-600/10 text-cyan-400 border border-cyan-500/30">
                    <div class="flex items-center space-x-2 md:space-x-3">
                        <span>🎬</span>
                        <span>Latest Movies</span>
                    </div>
                </button>

                <button onclick="switchPage('search')" id="navSearch" class="flex-shrink-0 md:w-full flex items-center space-x-2 md:space-x-3 px-3 md:px-4 py-2 rounded-xl text-xs md:text-sm font-medium text-slate-400 hover:bg-slate-800/40">
                    <span>🔍</span>
                    <span>Search</span>
                </button>

                <button onclick="switchPage('mylist')" id="navMyList" class="flex-shrink-0 md:w-full flex items-center space-x-2 md:space-x-3 px-3 md:px-4 py-2 rounded-xl text-xs md:text-sm font-medium text-slate-400 hover:bg-slate-800/40">
                    <span>🔖</span>
                    <span>My List</span>
                </button>

                <button onclick="switchPage('guide')" id="navGuide" class="flex-shrink-0 md:w-full flex items-center space-x-2 md:space-x-3 px-3 md:px-4 py-2 rounded-xl text-xs md:text-sm font-medium text-slate-400 hover:bg-slate-800/40">
                    <span>📅</span>
                    <span>Live Guide</span>
                </button>
            </nav>
        </div>

        <!-- Sidebar Footer -->
        <div class="hidden md:block p-4 border-t border-slate-800/40 space-y-3">
            <div class="flex items-center space-x-3 p-2.5 rounded-xl bg-slate-900/80 border border-slate-800">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center font-bold text-white text-xs shadow">
                    DD
                </div>
                <div class="overflow-hidden flex-1">
                    <div class="text-xs font-bold text-white truncate">Daniel Dudek</div>
                    <div class="text-[9px] text-pink-400 font-medium">Lead Architect</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Dynamic Viewport Area -->
    <main class="flex-1 flex flex-col h-[calc(100vh-60px)] md:h-screen overflow-hidden bg-gradient-to-br from-[#060913] via-[#0b1021] to-[#04060c]">

        <!-- PAGE 1: LIVE IPTV VIEW -->
        <div id="pageIptv" class="flex-1 flex flex-col p-4 md:p-8 overflow-y-auto custom-scrollbar hidden">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-4 md:mb-6 gap-3">
                <div>
                    <h2 class="text-2xl md:text-3xl font-black text-white tracking-tight">Live Television</h2>
                    <p class="text-xs text-slate-400 mt-0.5">Direct stream routing with automatic error recovery</p>
                </div>
                <div class="relative">
                    <input type="text" id="iptvSearchInput" oninput="filterChannels(this.value)" placeholder="Search channels..." class="bg-[#11182d] border border-slate-800 rounded-xl px-4 py-2 pl-9 text-xs text-slate-200 focus:outline-none focus:border-pink-500 w-full md:w-64">
                    <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🔍</span>
                </div>
            </div>

            <!-- Content Grid -->
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 md:gap-6 flex-1 min-h-[350px]">
                <div class="lg:col-span-2 flex flex-col">
                    <div class="relative flex-1 bg-black rounded-2xl overflow-hidden shadow-2xl border border-slate-800/80 min-h-[260px] md:min-h-[380px] flex items-center justify-center">
                        <div id="streamAlert" class="absolute top-3 left-3 z-20 hidden bg-amber-950/90 border border-amber-500/60 text-amber-200 text-xs px-3 py-1.5 rounded-lg backdrop-blur">
                            <span id="streamAlertText">Using backup stream route.</span>
                        </div>
                        <video id="videoPlayer" controls autoplay playsinline class="w-full h-full object-contain absolute inset-0"></video>
                    </div>

                    <div class="mt-3 bg-[#0d1326] border border-slate-800/80 rounded-xl p-3 md:p-4 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            <div id="activeChannelIcon" class="w-10 h-10 rounded-xl bg-pink-600/20 border border-pink-500/40 flex items-center justify-center text-lg">📺</div>
                            <div>
                                <h3 id="currentChannelName" class="text-sm md:text-base font-bold text-white">Select Channel</h3>
                                <p id="currentChannelSub" class="text-[11px] text-slate-400">Choose feed from below</p>
                            </div>
                        </div>
                        <button onclick="toggleFavorite()" id="favBtn" class="px-3 py-2 rounded-xl bg-[#161f38] border border-slate-700/60 text-xs font-semibold">🤍 Favorite</button>
                    </div>
                </div>

                <!-- EPG Sidebar -->
                <div class="bg-[#0d1326]/90 border border-slate-800/80 rounded-2xl p-4 flex flex-col max-h-[220px] lg:max-h-none">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-800/60 mb-2">
                        <span class="text-xs font-bold uppercase text-slate-300">Program Guide</span>
                        <span id="epgChannelTag" class="text-[10px] font-bold px-2 py-0.5 rounded bg-pink-950 text-pink-300">IPTV</span>
                    </div>
                    <div id="epgList" class="space-y-2 overflow-y-auto flex-1 custom-scrollbar pr-1"></div>
                </div>
            </div>

            <!-- Channel Selector Strip -->
            <div class="mt-4 md:mt-6">
                <h3 class="text-xs font-bold tracking-wider uppercase text-slate-400 mb-2">Available Channels (<span id="channelCount">0</span>)</h3>
                <div id="channelsGrid" class="grid grid-flow-col auto-cols-[140px] md:auto-cols-[180px] gap-3 overflow-x-auto custom-scrollbar pb-2"></div>
            </div>
        </div>

        <!-- PAGE 2: AETHER PRIVATE CINEMA (MOVIES) -->
        <div id="pageMovies" class="flex-1 flex flex-col overflow-y-auto custom-scrollbar relative aether-cinema-root">
            <div class="vignette"></div>
            <section class="aether-hero" id="hero">
                <div class="backdrops" id="backdrops"></div>
                <div class="scrim"></div>
                <div class="hero-content" id="heroContent"></div>
                <div class="dots" id="dots"></div>
            </section>
            <section class="collection" id="collection"></section>
        </div>

        <!-- PAGE 3: GENERIC VIEWS -->
        <div id="pageGeneric" class="flex-1 flex flex-col p-8 items-center justify-center text-center hidden">
            <h2 id="genericTitle" class="text-xl md:text-2xl font-bold text-white mb-2">Module Under Upgrade</h2>
            <button onclick="switchPage('movies')" class="mt-3 px-4 py-2 rounded-xl bg-cyan-600 text-white text-xs font-bold">Return to Movies</button>
        </div>
    </main>

    <!-- Video Player Modal -->
    <div class="player fixed inset-0 z-[100] bg-black hidden items-center justify-center" id="player" style="display:none;">
        <div class="stage relative w-full h-full md:w-[min(100vw,calc(100vh*16/9))] md:aspect-[16/9] bg-black" id="stage">
            <video id="video" playsinline class="w-full h-full block bg-black object-contain"></video>
            <button class="absolute top-4 right-4 bg-white/15 w-10 h-10 rounded-xl text-white z-20 flex items-center justify-center font-bold" id="closeBtn">✕</button>
        </div>
    </div>

    <div class="toast fixed left-1/2 bottom-6 -translate-x-1/2 z-[120] bg-slate-900 border border-slate-700 px-4 py-2 rounded-xl text-xs font-medium opacity-0 transition-all pointer-events-none" id="toast"></div>

    <!-- Application Script Engine -->
    <script>
        const channels = [
            { name: "A&E", category: "Entertainment", res: "1080p", format: "m3u8", url: "https://gpuserver3.tier1streams.com/AE/index.m3u8", fallbackUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", now: "Biography Special", next: "Real Life Mysteries", icon: "📺" },
            { name: "ABC", category: "News & Networks", res: "720p", format: "m3u8", url: "http://41.205.93.154/ABC/index.m3u8", fallbackUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", now: "National News Broadcast", next: "Prime Time Lineup", icon: "📡" }
        ];

        let currentChannel = channels[0];
        let hlsInstance = null;
        let dashInstance = null;
        const videoElement = document.getElementById('videoPlayer');

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('channelCount').innerText = channels.length;
            renderChannels(channels);
            renderEpg(channels[0]);
            loadActiveStream(channels[0]);
            initAetherCinema();
            switchPage('movies'); // Default to movies view for better initial load performance on mobile
        });

        function switchPage(page) {
            document.getElementById('pageIptv').classList.add('hidden');
            document.getElementById('pageMovies').classList.add('hidden');
            document.getElementById('pageGeneric').classList.add('hidden');

            ['navIptv', 'navMovies', 'navSearch', 'navMyList', 'navGuide'].forEach(id => {
                const btn = document.getElementById(id);
                if(btn) btn.className = "flex-shrink-0 md:w-full flex items-center space-x-2 md:space-x-3 px-3 md:px-4 py-2 rounded-xl text-xs md:text-sm font-medium text-slate-400 hover:bg-slate-800/40";
            });

            if (page === 'iptv') {
                document.getElementById('pageIptv').classList.remove('hidden');
                document.getElementById('navIptv').className = "flex-shrink-0 md:w-full flex items-center space-x-2 md:space-x-3 px-3 md:px-4 py-2.5 rounded-xl text-xs md:text-sm font-semibold bg-pink-600/20 text-pink-400 border border-pink-500/30";
            } else if (page === 'movies') {
                document.getElementById('pageMovies').classList.remove('hidden');
                document.getElementById('navMovies').className = "flex-shrink-0 md:w-full flex items-center space-x-2 md:space-x-3 px-3 md:px-4 py-2.5 rounded-xl text-xs md:text-sm font-semibold bg-cyan-600/20 text-cyan-400 border border-cyan-500/30";
            } else {
                document.getElementById('pageGeneric').classList.remove('hidden');
                document.getElementById('genericTitle').innerText = `${page.toUpperCase()} Module`;
            }
        }

        function renderChannels(list) {
            const grid = document.getElementById('channelsGrid');
            if(!grid) return;
            grid.innerHTML = '';
            list.forEach(ch => {
                const isSelected = currentChannel.name === ch.name;
                const card = document.createElement('div');
                card.onclick = () => selectChannel(ch);
                card.className = `p-3 rounded-xl border cursor-pointer transition-all flex flex-col justify-between h-20 shrink-0 ${isSelected ? 'bg-pink-600/20 border-pink-500 text-white' : 'bg-[#0d1326] border-slate-800 text-slate-300'}`;
                card.innerHTML = `
                    <div class="flex items-center justify-between"><span class="text-base">${ch.icon}</span><span class="text-[9px] px-1 rounded bg-slate-900">${ch.res}</span></div>
                    <div class="text-xs font-bold truncate">${ch.name}</div>
                `;
                grid.appendChild(card);
            });
        }

        function filterChannels(query) {
            const filtered = channels.filter(c => c.name.toLowerCase().includes(query.toLowerCase()) || c.category.toLowerCase().includes(query.toLowerCase()));
            renderChannels(filtered);
            document.getElementById('channelCount').innerText = filtered.length;
        }

        function selectChannel(ch) {
            currentChannel = ch;
            document.getElementById('currentChannelName').innerText = ch.name;
            document.getElementById('currentChannelSub').innerText = `${ch.category} (${ch.res})`;
            renderChannels(channels);
            renderEpg(ch);
            loadActiveStream(ch);
        }

        function loadActiveStream(ch, useFallback = false) {
            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            const targetUrl = useFallback ? ch.fallbackUrl : ch.url;
            if (Hls.isSupported() && targetUrl.includes('.m3u8')) {
                hlsInstance = new Hls({ maxBufferLength: 15 });
                hlsInstance.loadSource(targetUrl);
                hlsInstance.attachMedia(videoElement);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => videoElement.play().catch(() => {}));
                hlsInstance.on(Hls.Events.ERROR, (e, data) => { if(data.fatal && !useFallback) loadActiveStream(ch, true); });
            } else {
                videoElement.src = targetUrl;
                videoElement.play().catch(() => {});
            }
        }

        function renderEpg(channel) {
            const list = document.getElementById('epgList');
            if(!list) return;
            list.innerHTML = '';
            document.getElementById('epgChannelTag').innerText = channel.name.toUpperCase();
            [{ time: "18:00", show: channel.now, live: true }, { time: "20:00", show: channel.next, live: false }].forEach(slot => {
                const item = document.createElement('div');
                item.className = `p-2.5 rounded-lg border text-xs ${slot.live ? 'bg-pink-950/30 border-pink-500/40 text-white' : 'bg-slate-900/40 border-slate-800 text-slate-300'}`;
                item.innerHTML = `<div class="font-bold text-[10px] text-pink-400">${slot.time}</div><div class="font-semibold">${slot.show}</div>`;
                list.appendChild(item);
            });
        }

        function toggleFavorite() {
            const btn = document.getElementById('favBtn');
            btn.classList.toggle('bg-pink-600/20');
            btn.classList.toggle('border-pink-500');
        }

        function initAetherCinema() {
            const FILMS=[
                {id:1,title:"A Knight's Tale",year:2001,rating:7.0,match:96,duration:"2h 27m",genres:["Action"],accent:"#d4af37",rgb:"212,175,55",backdrop:"https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=800&q=80",poster:"https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=400&q=80",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4",quality:"2160p UHD",cats:["new","trending"],synopsis:"A peasant squire creates a new life of nobility and romance."},
                {id:2,title:"Blade Runner 2049",year:2017,rating:8.0,match:99,duration:"2h 44m",genres:["Sci-Fi"],accent:"#f59e0b",rgb:"245,158,11",backdrop:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80",poster:"https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=400&q=80",video:"https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",quality:"2160p",cats:["trending","acclaimed"],synopsis:"Young Blade Runner K's discovery leads him to Rick Deckard."},
            ];

            const ROWS=[{key:"trending",label:"Trending Tonight"},{key:"new",label:"New Releases"}];
            const SPOTLIGHT_IDS=[1,2];
            let activeIdx=0;

            const backdropsEl=document.getElementById('backdrops');
            const heroContentEl=document.getElementById('heroContent');
            const dotsEl=document.getElementById('dots');
            const collectionEl=document.getElementById('collection');

            function renderHero(){
                backdropsEl.innerHTML=''; dotsEl.innerHTML='';
                SPOTLIGHT_IDS.forEach((id,i)=>{
                    const f=FILMS.find(x=>x.id===id);
                    const bd=document.createElement('div');
                    bd.className=`bd ${i===0?'active':''}`;
                    bd.style.backgroundImage=`url('${f.backdrop}')`;
                    backdropsEl.appendChild(bd);

                    const dot=document.createElement('button');
                    dot.className=`dot ${i===0?'active':''}`;
                    dot.onclick=()=>updateHeroContent(i);
                    dotsEl.appendChild(dot);
                });
                updateHeroContent(0);
            }

            function updateHeroContent(idx){
                activeIdx=idx;
                const f=FILMS.find(x=>x.id===SPOTLIGHT_IDS[idx]);
                document.querySelectorAll('.bd').forEach((b,i)=>b.classList.toggle('active',i===idx));
                document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===idx));

                heroContentEl.innerHTML=`
                    <div class="eyebrow">${f.genres[0]} Feature</div>
                    <h2 class="hero-title">${f.title}</h2>
                    <div class="hero-meta">
                        <span class="match">${f.match}% Match</span><span class="sep"></span>
                        <span class="rating-pill">★ ${f.rating}</span><span class="sep"></span>
                        <span>${f.year}</span>
                    </div>
                    <p class="hero-synopsis">${f.synopsis}</p>
                    <div class="hero-actions">
                        <button class="btn-play" onclick="playFilm(${f.id})">▶ Play Film</button>
                    </div>
                `;
            }

            window.playFilm=function(id){
                const f=FILMS.find(x=>x.id===id);
                if(!f)return;
                const playerEl=document.getElementById('player');
                const videoEl=document.getElementById('video');
                playerEl.style.display="flex";
                videoEl.src=f.video;
                videoEl.play().catch(()=>{});
            }

            document.getElementById('closeBtn').onclick = () => {
                const playerEl=document.getElementById('player');
                const videoEl=document.getElementById('video');
                videoEl.pause();
                videoEl.src="";
                playerEl.style.display="none";
            };

            function renderCollection(){
                collectionEl.innerHTML='';
                ROWS.forEach(r=>{
                    const list=FILMS;
                    const row=document.createElement('div');
                    row.className='row';
                    row.innerHTML=`<div class="row-head"><h3 class="row-title">${r.label}</h3></div><div class="row-track" id="track-${r.key}"></div>`;
                    const track=row.querySelector('.row-track');
                    list.forEach(f=>{
                        const card=document.createElement('div');
                        card.className='card';
                        card.onclick=()=>playFilm(f.id);
                        card.innerHTML=`
                            <div class="card-img" style="background-image:url('${f.poster}')"></div>
                            <div class="card-scrim"></div>
                            <div class="card-top"><span class="badge rating">★ ${f.rating}</span></div>
                            <div class="card-info"><h3>${f.title}</h3><p>${f.genres.join(' · ')}</p></div>
                        `;
                        track.appendChild(card);
                    });
                    collectionEl.appendChild(row);
                });
            }

            renderHero();
            renderCollection();
        }
    </script>
</body>
</html>
