<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS TV - Auto Archive Streamer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-wider text-amber-500">NEXUS <span class="text-zinc-100">TV</span></h1>
        <span id="statusBadge" class="text-xs text-amber-400 bg-amber-950/50 border border-amber-800/50 px-3 py-1 rounded-full">Connecting to Archive...</span>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
        <div id="loader" class="flex flex-col items-center justify-center py-20 gap-4">
            <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-amber-500"></div>
            <p class="text-sm text-zinc-400">Auto-discovering movies from Archive.org...</p>
        </div>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Video Modal / Player -->
    <div id="player" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="stage" class="relative w-full max-w-5xl aspect-video bg-black flex items-center justify-center">
            <video id="video" class="w-full h-full" controls autoplay></video>
        </div>
        <div class="w-full max-w-5xl p-4 flex justify-between items-center bg-zinc-900 border-t border-zinc-800">
            <div>
                <h3 id="pTitle" class="font-bold text-lg text-white">Title</h3>
                <p id="pMeta" class="text-xs text-zinc-400">Auto Stream</p>
            </div>
            <div>
                <button id="closeBtn" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded text-sm font-semibold">Close Player</button>
            </div>
        </div>
    </div>

    <script>
        let activeItems = [];
        const identifier = 'TOP-MOVIES-ENG-1080P';

        // Automatically fetch file list from Archive.org API on startup
        async function fetchArchiveContent() {
            try {
                const response = await fetch(`https://archive.org/metadata/${identifier}`);
                const data = await response.json();
                
                // Extract server node prefix and file array safely
                const server = data.server;
                const dir = data.dir;
                const files = data.files;

                // Filter out only .mp4 video files from the directory structure
                activeItems = files
                    .filter(file => file.name.endsWith('.mp4'))
                    .map(file => {
                        // Clean up the file name to create a readable title
                        let rawName = file.name.split('/').pop().replace('.mp4', '');
                        let cleanTitle = decodeURIComponent(rawName)
                            .replace(/\./g, ' ')
                            .replace(/1080p|BluRay|x264|YIFY|HDRip|WEB-DL/gi, '')
                            .trim();

                        return {
                            id: identifier,
                            title: cleanTitle || 'Untitled Movie',
                            year: file.year || '2023',
                            genres: ['Feature Film'],
                            category: 'movies',
                            // Construct the exact working URL dynamically using the archive server node path
                            video: `https://${server}${dir}/${file.name}`
                        };
                    });

                document.getElementById('loader').style.display = 'none';
                document.getElementById('statusBadge').innerText = `${activeItems.length} Titles Loaded`;
                renderGrid(activeItems);

            } catch (error) {
                console.error("Failed to load archive index:", error);
                document.getElementById('loader').innerHTML = '<p class="text-rose-500 text-sm">Failed to connect to Archive.org API index.</p>';
                document.getElementById('statusBadge').innerText = 'Connection Error';
            }
        }

        function renderGrid(items) {
            const gridEl = document.getElementById('grid');
            if(items.length === 0) {
                gridEl.innerHTML = '<p class="text-zinc-500 col-span-full text-center py-10">No video files found in this collection.</p>';
                return;
            }
            gridEl.innerHTML = items.map((item, index) => `
                <div onclick="openPlayer(${index})" class="bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden cursor-pointer hover:border-amber-500 transition group flex flex-col justify-between">
                    <div class="aspect-video bg-zinc-950 flex items-center justify-center relative overflow-hidden">
                        <img src="https://archive.org/services/img/${item.id}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300x169?text=NEXUS+TV'">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <span class="px-4 py-2 bg-amber-500 text-black font-bold rounded text-xs shadow-lg">Play Stream</span>
                        </div>
                    </div>
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-zinc-800 text-zinc-300 rounded">1080p Movie</span>
                            <h4 class="font-semibold text-sm mt-2 line-clamp-2 text-zinc-100">${item.title}</h4>
                        </div>
                        <p class="text-xs text-zinc-400 mt-3">Direct Archive Stream</p>
                    </div>
                </div>
            `).join('');
        }

        const playerEl = document.getElementById('player');
        const videoEl = document.getElementById('video');

        function openPlayer(index){
            const f = activeItems[index];
            if(!f) return;
            playerEl.style.display = 'flex';
            setTimeout(() => playerEl.classList.add('opacity-100'), 10);
            document.getElementById('pTitle').innerText = f.title;
            videoEl.src = f.video;
            videoEl.load();
            videoEl.play().catch(err => console.log("Playback prevented:", err));
        }

        function closePlayer(){
            videoEl.pause();
            videoEl.src = "";
            playerEl.classList.remove('opacity-100');
            setTimeout(() => playerEl.style.display = 'none', 300);
        }

        document.getElementById('closeBtn').onclick = closePlayer;

        // Run auto-discovery on page load
        fetchArchiveContent();
    </script>
</body>
</html>
