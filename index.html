<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS TV - Modern Archive Streamer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-wider text-amber-500">NEXUS <span class="text-zinc-100">TV</span></h1>
        <nav class="flex gap-4 text-sm font-medium">
            <button onclick="filterCategory('all')" class="category-btn text-amber-400 hover:text-amber-300 transition">All Content</button>
            <button onclick="filterCategory('movies')" class="category-btn text-zinc-400 hover:text-zinc-200 transition">Movies (1971+)</button>
            <button onclick="filterCategory('series')" class="category-btn text-zinc-400 hover:text-zinc-200 transition">TV Series</button>
            <button onclick="filterCategory('adult')" class="category-btn text-rose-400 hover:text-rose-300 transition">Adult / Mature</button>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
        <div id="loader" class="flex flex-col items-center justify-center py-20 gap-4">
            <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-amber-500"></div>
            <p class="text-sm text-zinc-400">Loading massive stream library from Archive pools...</p>
        </div>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Video Modal / Player -->
    <div id="player" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="stage" class="relative w-full max-w-5xl aspect-video bg-black flex items-center justify-center">
            <video id="video" class="w-full h-full"></video>
            <div id="loadingSpinner" class="absolute inset-0 flex items-center justify-center bg-black/50">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-amber-500"></div>
            </div>
        </div>
        <div class="w-full max-w-5xl p-4 flex justify-between items-center bg-zinc-900 border-t border-zinc-800">
            <div>
                <h3 id="pTitle" class="font-bold text-lg">Title</h3>
                <p id="pMeta" class="text-xs text-zinc-400">Metadata</p>
            </div>
            <div class="flex items-center gap-4">
                <button id="ppBtn" class="p-2 bg-amber-500 text-black rounded font-bold text-xs">Play/Pause</button>
                <input id="seek" type="range" min="0" max="1000" value="0" class="w-32 accent-amber-500">
                <span id="curTime" class="text-xs text-zinc-300">0:00</span> / <span id="durTime" class="text-xs text-zinc-300">0:00</span>
                <button id="muteBtn" class="text-sm text-zinc-300 hover:text-white">Mute</button>
                <input id="vol" type="range" min="0" max="100" value="100" class="w-20 accent-amber-500">
                <button id="fsBtn" class="text-sm text-zinc-300 hover:text-white">Fullscreen</button>
                <button id="closeBtn" class="px-3 py-1 bg-zinc-800 hover:bg-zinc-700 rounded text-sm">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Expanded Archive queries targeting high-volume feature films, television, and isolated adult categories from 1971+
        const ARCHIVE_ENDPOINTS = {
            main: 'https://archive.org/advancedsearch.php?q=collection:(feature_films OR classic_tv OR cinema OR mpeg_movies) AND date:[1971-01-01 TO 2030-12-31] AND NOT subject:(homevideo OR amateur OR silent OR corporate) AND mediatype:movies&fl[]=identifier&fl[]=title&fl[]=year&fl[]=genre&fl[]=mediatype&rows=100&output=json',
            adult: 'https://archive.org/advancedsearch.php?q=collection:(feature_films OR adult) AND date:[1971-01-01 TO 2030-12-31] AND subject:(adult OR erotic) AND mediatype:movies&fl[]=identifier&fl[]=title&fl[]=year&fl[]=genre&fl[]=mediatype&rows=40&output=json'
        };

        let activeItems = [];

        async function fetchContent() {
            try {
                const [mainRes, adultRes] = await Promise.all([
                    fetch(ARCHIVE_ENDPOINTS.main),
                    fetch(ARCHIVE_ENDPOINTS.adult)
                ]);
                
                const mainData = await mainRes.json();
                const adultData = await adultRes.json();

                const formatDocs = (docs, category) => docs.map(doc => ({
                    id: doc.identifier,
                    title: doc.title || 'Untitled Feature',
                    year: doc.year || '1971+',
                    genres: doc.genre ? [doc.genre].flat() : [category === 'adult' ? 'Adult' : 'Feature Film'],
                    category: category,
                    video: `https://archive.org/download/${doc.identifier}/${doc.identifier}.mp4`
                }));

                activeItems = [
                    ...formatDocs(mainData.response.docs, 'movies'),
                    ...formatDocs(adultData.response.docs, 'adult')
                ];

                document.getElementById('loader').style.display = 'none';
                renderGrid(activeItems);
            } catch (err) {
                console.error("Failed to load Archive data", err);
                document.getElementById('loader').innerHTML = '<p class="text-rose-500">Error loading high-volume stream library.</p>';
            }
        }

        function renderGrid(items) {
            const gridEl = document.getElementById('grid');
            if(items.length === 0) {
                gridEl.innerHTML = '<p class="text-zinc-500 col-span-full text-center py-10">No titles found matching this filter.</p>';
                return;
            }
            gridEl.innerHTML = items.map((item, index) => `
                <div onclick="openPlayer(${index})" class="bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden cursor-pointer hover:border-amber-500 transition group flex flex-col justify-between">
                    <div class="aspect-video bg-zinc-950 flex items-center justify-center relative overflow-hidden">
                        <img src="https://archive.org/services/img/${item.id}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300x169?text=NEXUS+TV'">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <span class="px-4 py-2 bg-amber-500 text-black font-bold rounded text-xs shadow-lg">Play Stream</span>
                        </div>
                    </div>
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-zinc-800 text-zinc-300 rounded">${item.category}</span>
                            <h4 class="font-semibold text-sm mt-2 line-clamp-2 text-zinc-100">${item.title}</h4>
                        </div>
                        <p class="text-xs text-zinc-400 mt-3">${item.year} · ${item.genres[0]}</p>
                    </div>
                </div>
            `).join('');
        }

        function filterCategory(cat) {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(b => b.classList.remove('text-amber-400', 'text-rose-400'));
            
            if(cat === 'all') {
                renderGrid(activeItems);
            } else if(cat === 'adult') {
                renderGrid(activeItems.filter(i => i.category === 'adult'));
            } else if(cat === 'movies') {
                renderGrid(activeItems.filter(i => i.category === 'movies' && !i.genres.some(g => g.toLowerCase().includes('series') || g.toLowerCase().includes('tv'))));
            } else if(cat === 'series') {
                renderGrid(activeItems.filter(i => i.category === 'movies' && i.genres.some(g => g.toLowerCase().includes('series') || g.toLowerCase().includes('tv'))));
            }
        }

        // Player UI Controls & Full Custom Setup Logic
        const playerEl = document.getElementById('player');
        const videoEl = document.getElementById('video');
        const loaderEl = document.getElementById('loadingSpinner');
        const stageEl = document.getElementById('stage');
        const seekEl = document.getElementById('seek');
        const curTimeEl = document.getElementById('curTime');
        const durTimeEl = document.getElementById('durTime');
        const ppBtn = document.getElementById('ppBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volEl = document.getElementById('vol');
        const fsBtn = document.getElementById('fsBtn');

        function openPlayer(index){
            const f = activeItems[index];
            if(!f) return;
            playerEl.style.display = 'flex';
            setTimeout(() => playerEl.classList.add('opacity-100'), 10);
            document.getElementById('pTitle').innerText = f.title;
            document.getElementById('pMeta').innerText = `${f.genres.join(' · ')} · ${f.year}`;
            videoEl.src = f.video;
            videoEl.play().catch(()=>{});
            setupUI();
        }

        function closePlayer(){
            videoEl.pause();
            videoEl.src = "";
            playerEl.classList.remove('opacity-100');
            setTimeout(() => playerEl.style.display = 'none', 300);
            if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
        }

        document.getElementById('closeBtn').onclick = closePlayer;

        function setupUI(){
            videoEl.onwaiting = () => loaderEl.style.display = 'flex';
            videoEl.onplaying = () => loaderEl.style.display = 'none';
            videoEl.ontimeupdate = () => {
                if(!videoEl.duration) return;
                const p = (videoEl.currentTime / videoEl.duration) * 1000;
                seekEl.value = p;
                curTimeEl.innerText = fmtTime(videoEl.currentTime);
                durTimeEl.innerText = fmtTime(videoEl.duration);
            };
            videoEl.onplay = () => ppBtn.innerText = 'Pause';
            videoEl.onpause = () => ppBtn.innerText = 'Play';
        }

        function fmtTime(s){
            if(!isFinite(s)) return "0:00";
            s = Math.floor(s);
            const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
            return h ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}` : `${m}:${String(sec).padStart(2,'0')}`;
        }

        seekEl.oninput = (e) => {
            if(!videoEl.duration) return;
            videoEl.currentTime = (e.target.value / 1000) * videoEl.duration;
        };

        ppBtn.onclick = () => {
            if(videoEl.paused) videoEl.play(); else videoEl.pause();
        };

        muteBtn.onclick = () => {
            videoEl.muted = !videoEl.muted;
            volEl.value = videoEl.muted ? 0 : (videoEl.volume * 100);
            muteBtn.innerText = videoEl.muted ? 'Unmute' : 'Mute';
        };

        volEl.oninput = (e) => {
            const v = e.target.value / 100;
            videoEl.volume = v;
            videoEl.muted = (v === 0);
            muteBtn.innerText = videoEl.muted ? 'Unmute' : 'Mute';
        };

        fsBtn.onclick = () => {
            if(!document.fullscreenElement) stageEl.requestFullscreen().catch(()=>{});
            else document.exitFullscreen().catch(()=>{});
        };

        fetchContent();
    </script>
</body>
</html>
