<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Guide & Plasma Player</title>
  
  <!-- HLS and DASH libraries for video playback -->

  <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>

  <style>
    :root {
      --bg-color: #05070a;
      --card-bg: #111622;
      --accent: #00f0ff;
      --text-main: #ffffff;
      --text-sub: #94a3b8;
      --border: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      padding-bottom: 3rem;
      background-image: radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.08) 0%, transparent 60%);
    }

    /* Top Search Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.2rem 3rem;
      background: rgba(5, 7, 10, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
    }

    .brand span { color: var(--accent); }

    .search-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 0.5rem 1.2rem;
      color: #fff;
      font-size: 0.9rem;
      width: 260px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--accent);
      width: 320px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    /* Active Player Section - Fixed Layout preventing resize/minimizing on channel change */
    .top-player-section {
      padding: 1.5rem 3rem 1rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.6rem;
      width: 100%;
      max-width: 1100px;
    }

    .player-title {
      font-weight: 700;
      font-size: 1.15rem;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .player-title::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #00ff66;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff66;
    }

    /* Plasma TV Frame Look with locked dimensions */
    .plasma-tv-frame {
      width: 100%;
      max-width: 1100px;
      background: #000;
      border-radius: 16px;
      padding: 12px;
      border: 2px solid #263248;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.8),
        0 0 30px rgba(0, 240, 255, 0.15),
        inset 0 0 10px rgba(0, 0, 0, 0.9);
      position: relative;
    }

    .screen-container {
      position: relative;
      width: 100%;
      background: #050505;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #111;
    }

    video {
      width: 100%;
      height: 520px; /* Fixed height locks player frame size consistently across channel switches */
      object-fit: cover;
      display: block;
      background: #000;
    }

    /* TV Stand Base Simulation */
    .tv-stand {
      width: 140px;
      height: 10px;
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      margin: 0 auto;
      border-radius: 0 0 6px 6px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.5);
      position: relative;
    }
    
    .tv-stand::after {
      content: '';
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 2px;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
    }

    /* Compact Hero Banner to keep player fully visible on load */
    .hero {
      position: relative;
      height: 180px;
      background: linear-gradient(180deg, rgba(5,7,10,0) 0%, rgba(5,7,10,0.9) 100%), 
                  url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1.5rem 3rem;
      margin-top: 0.5rem;
    }

    .hero-content {
      max-width: 600px;
      z-index: 2;
    }

    .hero-tag {
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .hero h1 {
      font-size: 1.6rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 0.3rem;
    }

    .hero p {
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    /* Content Layout */
    .content-container {
      padding: 0 3rem;
      margin-top: 0.5rem;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 1.5rem 0 0.8rem 0;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 15px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Horizontal Scroll Rows */
    .media-row {
      display: flex;
      gap: 1.2rem;
      overflow-x: auto;
      padding: 0.5rem 0 1rem 0;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }

    .media-row::-webkit-scrollbar { height: 6px; }
    .media-row::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    /* Channel Poster Cards */
    .channel-card {
      min-width: 200px;
      height: 120px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
      overflow: hidden;
      text-decoration: none;
    }

    .channel-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
    }

    .channel-card:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(0, 240, 255, 0.2);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      z-index: 1;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }

    .badge-res {
      background: rgba(0, 240, 255, 0.1);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }

    .tag-format {
      font-size: 0.7rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
  </style>
</head>

    { name: "ICI RDI", category: "News & Regional", res: "720p", format: "m3u8", url: "https://rcavlive.akamaized.net/hls/live/704025/xcanrdi/master.m3u8" },
    { name: "icnet 1", category: "International", res: "Live", format: "m3u8", url: "https://icnet1hls.wns.live/hls/stream.m3u8" }
  ];

  let hlsPlayer = null;
  let dashPlayer = null;

  function renderInterface(filteredChannels) {
    const container = document.getElementById('categoryContainer');
    container.innerHTML = '';

    const categories = [...new Set(channels.map(c => c.category))];

    categories.forEach(cat => {
      const catChannels = filteredChannels.filter(c => c.category === cat);
      if (catChannels.length === 0) return;

      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.innerText = cat;

      const row = document.createElement('div');
      row.className = 'media-row';

      catChannels.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => playChannel(ch);
        card.innerHTML = `
          <div class="card-title">${ch.name}</div>
          <div class="card-footer">
            <span class="badge-res">${ch.res}</span>
            <span class="tag-format">${ch.format}</span>
          </div>
        `;
        row.appendChild(card);
      });

      container.appendChild(sectionTitle);
      container.appendChild(row);
    });

    if (container.children.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 4rem; color: var(--text-sub);">No channels found matching your search.</div>`;
    }
  }

  function playChannel(channel) {
    const video = document.getElementById('videoPlayer');
    const title = document.getElementById('playerTitle');

    title.innerText = `Streaming Live: ${channel.name} (${channel.res})`;
    // Keeps window locked in place (prevents jumping or forced auto-scrolling away from player)

    if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
    if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }

    if (channel.format === 'm3u8') {
      if (Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(channel.url);
        hlsPlayer.attachMedia(video);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.play();
      }
    } else if (channel.format === 'mpd') {
      dashPlayer = dashjs.MediaPlayer().create();
      dashPlayer.initialize(video, channel.url, true);
    } else {
      video.src = channel.url;
      video.play();
    }
  }

  function filterChannels() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = channels.filter(c => c.name.toLowerCase().includes(query));
    renderInterface(filtered);
  }

  // Initial render of guide cards
  renderInterface(channels);

  // Auto-play the first channel immediately on page load
  window.addEventListener('DOMContentLoaded', () => {
    playChannel(channels[0]);
  });
</script>
