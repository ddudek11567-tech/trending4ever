<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Library</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0b0b;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        header h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .movie-card {
            position: relative;
            height: 160px;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            background-color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #222;
            transition: transform 0.2s, border-color 0.2s;
        }
        .movie-card:hover {
            transform: scale(1.03);
            border-color: #444;
        }
        .movie-card .backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
        }
        .movie-card .logo {
            position: relative;
            max-width: 75%;
            max-height: 60px;
            object-fit: contain;
            z-index: 2;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.9));
        }
        .movie-card .fallback-title {
            position: relative;
            z-index: 2;
            font-size: 1.2rem;
            font-weight: bold;
            text-align: center;
            padding: 0 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }
        
        /* Modal Player */
        #player-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #player-modal button {
            margin-bottom: 15px;
            padding: 10px 20px;
            background-color: #e50914;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .iframe-container {
            width: 85%;
            max-width: 1000px;
            height: 550px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>My Movie Library</h1>
    </header>

    <main id="movie-grid" class="grid-container"></main>

    <!-- Player Modal View -->
    <div id="player-modal">
        <button onclick="closePlayer()">Close Player</button>
        <div class="iframe-container">
            <iframe id="embed-frame" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        // ADD YOUR MOVIES HERE MANUALLY
        const myMovies = [
            {
                title: "Star Wars: The Force Awakens",
                id: 140607, // Automatically powers the embed player link
                backdrop: "https://image.tmdb.org/t/p/w780/nvus08WspfndnjgICrQ1LhWvjhw.jpg",
                logo: "https://image.tmdb.org/t/p/w500/6FsGeIpPWKcxphzmgTPv881K8o4.png"
            },
            {
                title: "Inception",
                id: 27205, // Automatically powers the embed player link
                backdrop: "https://image.tmdb.org/t/p/w780/s3TBrRGB1ij7gFOCJDRK9D8pkvL.jpg",
                logo: "https://image.tmdb.org/t/p/w500/oIkQkEkwfgbG7IGTseWpGvPkVZH.png"
            }
        ];

        const gridContainer = document.getElementById('movie-grid');
        const modal = document.getElementById('player-modal');
        const embedFrame = document.getElementById('embed-frame');

        function initLibrary() {
            gridContainer.innerHTML = '';

            myMovies.forEach(movie => {
                const card = document.createElement('div');
                card.classList.add('movie-card');

                let innerContent = `<img class="backdrop" src="${movie.backdrop}" alt="${movie.title}">`;
                if (movie.logo) {
                    innerContent += `<img class="logo" src="${movie.logo}" alt="${movie.title}">`;
                } else {
                    innerContent += `<span class="fallback-title">${movie.title}</span>`;
                }
                card.innerHTML = innerContent;

                // When clicked, loads the embed player right on your site using the ID
                card.addEventListener('click', () => {
                    embedFrame.src = `https://player.vidplus.to/embed/movie/${movie.id}`;
                    modal.style.display = 'flex';
                });

                gridContainer.appendChild(card);
            });
        }

        function closePlayer() {
            embedFrame.src = ''; // Stops playback instantly when closed
            modal.style.display = 'none';
        }

        initLibrary();
    </script>
</body>
</html>
