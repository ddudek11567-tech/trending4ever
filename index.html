<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS TV v4.3 - Media Suite & Live Stream Hub</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --surface-color: #1a1c23;
            --accent-color: #e50914;
            --accent-hover: #f40612;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --border-color: #2d3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Navigation */
        aside {
            width: 260px;
            background-color: var(--surface-color);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 16px;
        }

        .logo-area {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-color);
            margin-bottom: 32px;
            padding-left: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .nav-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }

        .nav-item {
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-muted);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-item:hover, .nav-item.active {
            background-color: rgba(229, 9, 20, 0.1);
            color: var(--text-main);
        }

        .nav-item.active {
            border-left: 4px solid var(--accent-color);
        }

        /* Main Content Area */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            background: radial-gradient(circle at top right, #1f2233 0%, var(--bg-color) 60%);
        }

        header {
            padding: 24px 36px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            background-color: rgba(15, 16, 21, 0.8);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .search-box {
            display: flex;
            align-items: center;
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 16px;
            width: 320px;
        }

        .search-box input {
            background: transparent;
            border: none;
            color: var(--text-main);
            outline: none;
            width: 100%;
            font-size: 0.9rem;
        }

        .content-container {
            padding: 36px;
            flex-grow: 1;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Grid Layouts */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 24px;
        }

        .media-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .media-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .media-poster {
            height: 140px;
            background-color: #2a2e3d;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 12px;
        }

        .badge {
            background-color: var(--accent-color);
            color: white;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
        }

        .media-info {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
            justify-content: space-between;
        }

        .media-title {
            font-size: 1rem;
            font-weight: 600;
        }

        .media-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Video Player Modal / View */
        #player-view {
            display: none;
            flex-direction: column;
            gap: 20px;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .player-wrapper iframe, .player-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
        }

        .back-btn {
            background-color: var(--surface-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            width: fit-content;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: var(--border-color);
        }

        /* Views management */
        .app-view {
            display: none;
        }

        .app-view.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside>
        <div>
            <div class="logo-area">
                <span>NEXUS TV</span> <span class="badge">v4.3</span>
            </div>
            <ul class="nav-links">
                <li class="nav-item active" onclick="switchView('live-tv', this)">Live Channels</li>
                <li class="nav-item" onclick="switchView('aether-cinema', this)">Aether Cinema</li>
                <li class="nav-item" onclick="switchView('archive-stream', this)">Archive Stream</li>
            </ul>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted); padding-left: 12px;">
            Engine Status: <span style="color: #10b981;">Online</span>
        </div>
    </aside>

    <!-- Main Dynamic Container -->
    <main>
        <header>
            <div id="header-title" style="font-weight: 600; font-size: 1.1rem;">Live Channels Hub</div>
            <div class="search-box">
                <input type="text" id="global-search" placeholder="Search streams or titles..." oninput="filterMedia(this.value)">
            </div>
        </header>

        <div class="content-container">

            <!-- VIEW 1: LIVE TV -->
            <div id="live-tv" class="app-view active">
                <div class="section-title">
                    <span>IPTV Direct Broadcasts</span>
                </div>
                <div class="media-grid" id="live-grid">
                    <!-- Cards injected via JS -->
                </div>
            </div>

            <!-- VIEW 2: AETHER CINEMA -->
            <div id="aether-cinema" class="app-view">
                <div class="section-title">
                    <span>Aether Private Cinema</span>
                </div>
                <div class="media-grid" id="cinema-grid">
                    <!-- Cards injected via JS -->
                </div>
            </div>

            <!-- VIEW 3: ARCHIVE STREAM -->
            <div id="archive-stream" class="app-view">
                <div class="section-title">
                    <span>Archive.org Curated Directory</span>
                </div>
                <div class="media-grid" id="archive-grid">
                    <!-- Cards injected via JS -->
                </div>
            </div>

            <!-- PLAYER VIEW (Shared) -->
            <div id="player-view" class="app-view">
                <button class="back-btn" onclick="closePlayer()">← Back to Directory</button>
                <div class="section-title" id="player-title" style="margin-bottom: 12px; font-size: 1.25rem;">Now Playing</div>
                <div class="player-wrapper" id="player-container">
                    <!-- Dynamic iframe/video injected here -->
                </div>
            </div>

        </div>
    </main>

    <script>
        // Data Registry with Backup Manifest HLS/Direct Hooks
        const liveChannels = [
            { id: 'espn', title: 'ESPN Live', category: 'Sports', badge: '1080p 60FPS', url: 'https://www.youtube.com/embed/live_stream?channel=UCWJ2lWNubArHWmf3FIHbfcQ', poster: 'linear-gradient(135deg, #002d62, #d50032)' },
            { id: 'abc', title: 'ABC News Live', category: 'News', badge: 'HD Feed', url: 'https://www.youtube.com/embed/live_stream?channel=UCQHYktaIBIGw8MpsV87V4UQ', poster: 'linear-gradient(135deg, #000000, #1c3d5a)' },
            { id: 'amc', title: 'AMC Suspense Stream', category: 'Movies', badge: 'Backup Active', url: 'https://www.youtube.com/embed/live_stream?channel=UC9yro1jT5XU_1Qe2U4u0gWQ', poster: 'linear-gradient(135deg, #4a0e17, #1a1a1a)' },
            { id: 'hbo', title: 'HBO Preview Channel', category: 'Entertainment', badge: '4K HDR', url: 'https://www.youtube.com/embed/live_stream?channel=UCpVjaSkXHsFMWDxZlW5Bv3Q', poster: 'linear-gradient(135deg, #1b263b, #0d1b2a)' }
        ];

        const cinemaMovies = [
            { id: 'c1', title: 'The House on the Web', category: 'Cosmic Horror', badge: 'Original', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', poster: 'linear-gradient(135deg, #1a0505, #4a1515)' },
            { id: 'c2', title: '1973 Crisis Historical Thriller', category: 'Suspense', badge: 'Feature', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', poster: 'linear-gradient(135deg, #1f2010, #3f3010)' }
        ];

        const archiveStreams = [
            { id: 'a1', title: 'Classic Noir Feature Reels', category: 'Archive.org', badge: 'Verified', url: 'https://archive.org/embed/detour_1945', poster: 'linear-gradient(135deg, #222, #444)' },
            { id: 'a2', title: 'Sci-Fi Golden Age Reels', category: 'Archive.org', badge: 'Verified', url: 'https://archive.org/embed/Plan9FromOuterSpace', poster: 'linear-gradient(135deg, #112, #335)' }
        ];

        function renderGrids() {
            // Render Live TV
            const liveGrid = document.getElementById('live-grid');
            liveGrid.innerHTML = liveChannels.map(item => `
                <div class="media-card" onclick="playMedia('${item.title}', '${item.url}')">
                    <div class="media-poster" style="background: ${item.poster};">
                        <span class="badge">${item.badge}</span>
                    </div>
                    <div class="media-info">
                        <div class="media-title">${item.title}</div>
                        <div class="media-meta">${item.category} • HLS Secure Backup</div>
                    </div>
                </div>
            `).join('');

            // Render Aether Cinema
            const cinemaGrid = document.getElementById('cinema-grid');
            cinemaGrid.innerHTML = cinemaMovies.map(item => `
                <div class="media-card" onclick="playMedia('${item.title}', '${item.url}')">
                    <div class="media-poster" style="background: ${item.poster};">
                        <span class="badge">${item.badge}</span>
                    </div>
                    <div class="media-info">
                        <div class="media-title">${item.title}</div>
                        <div class="media-meta">${item.category} • Aether Suite</div>
                    </div>
                </div>
            `).join('');

            // Render Archive Stream
            const archiveGrid = document.getElementById('archive-grid');
            archiveGrid.innerHTML = archiveStreams.map(item => `
                <div class="media-card" onclick="playMedia('${item.title}', '${item.url}')">
                    <div class="media-poster" style="background: ${item.poster};">
                        <span class="badge">${item.badge}</span>
                    </div>
                    <div class="media-info">
                        <div class="media-title">${item.title}</div>
                        <div class="media-meta">${item.category} • API Parsed</div>
                    </div>
                </div>
            `).join('');
        }

        function switchView(viewId, element) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            document.getElementById(viewId).classList.add('active');
            if(element) element.classList.add('active');

            const titles = {
                'live-tv': 'Live Channels Hub',
                'aether-cinema': 'Aether Private Cinema',
                'archive-stream': 'Archive.org Curated Directory'
            };
            document.getElementById('header-title').innerText = titles[viewId] || 'Media Suite';
        }

        function playMedia(title, url) {
            document.querySelectorAll('.app-view').forEach(v => v.classList.remove('active'));
            const playerView = document.getElementById('player-view');
            playerView.classList.add('active');

            document.getElementById('player-title').innerText = `Now Playing: ${title}`;
            const container = document.getElementById('player-container');
            container.innerHTML = `<iframe src="${url}?autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
        }

        function closePlayer() {
            document.getElementById('player-container').innerHTML = '';
            switchView('live-tv', document.querySelector('.nav-item'));
        }

        function filterMedia(query) {
            const q = query.toLowerCase();
            document.querySelectorAll('.media-card').forEach(card => {
                const text = card.innerText.toLowerCase();
                card.style.display = text.includes(q) ? 'flex' : 'none';
            });
        }

        // Initialize Application
        renderGrids();
    </script>
</body>
</html>
