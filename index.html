<html lang="en">
<head>

  <title>Smart TV Guide & Player</title>

  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #1a202c;
      --accent: #00d2ff;
      --text-main: #ffffff;
      --text-sub: #a0aec0;
      --border: #2d3748;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      padding-bottom: 3rem;
    }

    /* Top Search Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      background: linear-gradient(180deg, rgba(11,14,20,0.9) 0%, rgba(11,14,20,0) 100%);
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
    }

    .brand {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #fff;
    }

    .brand span { color: var(--accent); }

    .search-input {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 0.6rem 1.2rem;
      color: #fff;
      font-size: 0.9rem;
      width: 280px;
      outline: none;
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
    }

    .search-input:focus {
      background: rgba(255, 255, 255, 0.2);
      border-color: var(--accent);
      width: 340px;
    }

    /* Featured Hero Banner */
    .hero {
      position: relative;
      height: 420px;
      background: linear-gradient(180deg, rgba(11,14,20,0.3) 0%, rgba(11,14,20,1) 100%), 
                  url('https://images.unsplash.com/photo-1534447677768-be436bb09401?q=80&w=1200&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 2rem 3rem;
    }

    .hero-content {
      max-width: 600px;
      z-index: 2;
    }

    .hero-tag {
      font-size: 0.85rem;
      letter-spacing: 2px;
      color: var(--accent);
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .hero h1 {
      font-size: 2.8rem;
      font-weight: 800;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .hero p {
      color: var(--text-sub);
      font-size: 1rem;
      margin-bottom: 1.2rem;
    }

    /* Content Layout */
    .content-container {
      padding: 0 3rem;
      margin-top: -1rem;
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 2rem 0 1rem 0;
      color: #f1f5f9;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* Horizontal Scroll Rows */
    .media-row {
      display: flex;
      gap: 1.2rem;
      overflow-x: auto;
      padding: 0.5rem 0 1.2rem 0;
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }

    .media-row::-webkit-scrollbar { height: 6px; }
    .media-row::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 3px;
    }

    /* Channel Poster Cards */
    .channel-card {
      min-width: 210px;
      height: 130px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      position: relative;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1rem;
      overflow: hidden;
    }

    .channel-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.4) 100%);
      pointer-events: none;
    }

    .channel-card:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 10px 20px rgba(0, 210, 255, 0.2);
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      z-index: 1;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1;
    }

    .badge-res {
      background: rgba(0, 210, 255, 0.15);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: 700;
      border: 1px solid rgba(0, 210, 255, 0.3);
    }

    .tag-format {
      font-size: 0.7rem;
      color: var(--text-sub);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    /* Apps Row Tiles */
    .app-card {
      min-width: 120px;
      height: 70px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 0.95rem;
      color: white;
      cursor: pointer;
      transition: transform 0.2s ease;
      flex-shrink: 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    .app-card:hover { transform: scale(1.08); }
    .app-watchfree { background: linear-gradient(135deg, #e50914, #990000); }
    .app-hulu { background: linear-gradient(135deg, #1ce783, #00ad56); }
    .app-prime { background: linear-gradient(135deg, #00a8e1, #005691); }
    .app-vudu { background: linear-gradient(135deg, #3399ff, #0044aa); }
    .app-iheart { background: linear-gradient(135deg, #c60000, #660000); }

    /* Video Player Modal Overlay */
    .player-modal {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .player-modal.active {
      display: flex;
    }

    .player-container {
      width: 100%;
      max-width: 1000px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: 0 20px 50px rgba(0, 210, 255, 0.15);
      position: relative;
    }

    video {
      width: 100%;
      height: auto;
      max-height: 70vh;
      display: block;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      background: var(--card-bg);
      width: 100%;
      max-width: 1000px;
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
    }

    .player-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .close-btn:hover {
      background: #e50914;
    }
  </style>

  let hlsPlayer = null;
  let dashPlayer = null;

  function renderInterface(filteredChannels) {
    const container = document.getElementById('categoryContainer');
    container.innerHTML = '';

    const categories = [...new Set(channels.map(c => c.category))];

    categories.forEach(cat => {
      const catChannels = filteredChannels.filter(c => c.category === cat);
      if (catChannels.length === 0) return;

      const sectionTitle = document.createElement('div');
      sectionTitle.className = 'section-title';
      sectionTitle.innerText = cat;

      const row = document.createElement('div');
      row.className = 'media-row';

      catChannels.forEach(ch => {
        const card = document.createElement('div');
        card.className = 'channel-card';
        card.onclick = () => playChannel(ch);
        card.innerHTML = `
          <div class="card-title">${ch.name}</div>
          <div class="card-footer">
            <span class="badge-res">${ch.res}</span>
            <span class="tag-format">${ch.format}</span>
          </div>
        `;
        row.appendChild(card);
      });

      container.appendChild(sectionTitle);
      container.appendChild(row);
    });

    if (container.children.length === 0) {
      container.innerHTML = `<div style="text-align:center; padding: 4rem; color: var(--text-sub);">No channels found matching your search.</div>`;
    }
  }

  function playChannel(channel) {
    const modal = document.getElementById('playerModal');
    const video = document.getElementById('videoPlayer');
    const title = document.getElementById('playerTitle');

    title.innerText = `Streaming Live: ${channel.name} (${channel.res})`;
    modal.classList.add('active');

    // Reset existing engines
    if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
    if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }

    // Play based on format type
    if (channel.format === 'm3u8') {
      if (Hls.isSupported()) {
        hlsPlayer = new Hls();
        hlsPlayer.loadSource(channel.url);
        hlsPlayer.attachMedia(video);
        hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => video.play());
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = channel.url;
        video.play();
      }
    } else if (channel.format === 'mpd') {
      dashPlayer = dashjs.MediaPlayer().create();
      dashPlayer.initialize(video, channel.url, true);
    } else {
      video.src = channel.url;
      video.play();
    }
  }

  function closePlayer() {
    const modal = document.getElementById('playerModal');
    const video = document.getElementById('videoPlayer');

    video.pause();
    video.src = '';
    
    if (hlsPlayer) { hlsPlayer.destroy(); hlsPlayer = null; }
    if (dashPlayer) { dashPlayer.reset(); dashPlayer = null; }

    modal.classList.remove('active');
  }

  function filterChannels() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = channels.filter(c => c.name.toLowerCase().includes(query));
    renderInterface(filtered);
  }

  // Initial render
  renderInterface(channels);
</script>
