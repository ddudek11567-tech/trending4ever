<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --accent: #3b82f6;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      text-align: center;
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .search-bar {
      width: 100%;
      padding: 0.8rem 1.2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
    }

    .search-bar:focus {
      border-color: var(--accent);
    }

    .category-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 0.5rem 1rem;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .channel-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .channel-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
    }

    .channel-info h3 {
      font-size: 1.1rem;
      margin-bottom: 0.4rem;
    }

    .channel-category {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 0.8rem;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
      font-size: 0.75rem;
    }

    .badge {
      background: rgba(59, 130, 246, 0.2);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      font-weight: bold;
    }

    .format-tag {
      color: var(--text-sub);
      text-transform: uppercase;
    }
  </style>
</head>

  function renderChannels(data) {
    const grid = document.getElementById('channelGrid');

      grid.innerHTML = `<p style="color: var(--text-sub); grid-column: 1/-1; text-align: center; padding: 2rem;">No channels match your search.</p>`;
      return;
    }

    data.forEach(ch => {
      const card = document.createElement('div');
      card.className = 'channel-card';
      card.innerHTML = `
        <div class="channel-info">
          <h3>${ch.name}</h3>
          <div class="channel-category">${ch.category}</div>
        </div>
        <div class="card-footer">
          <span class="badge">${ch.res}</span>
          <span class="format-tag">${ch.format}</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function setCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.innerText === cat);
    });
    filterChannels();
  }

  function filterChannels() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = channels.filter(ch => {
      const matchesCategory = currentCategory === 'All' || ch.category === currentCategory;
      const matchesSearch = ch.name.toLowerCase().includes(query);
      return matchesCategory && matchesSearch;
    });
    renderChannels(filtered);
  }

  // Initial render
  renderChannels(channels);
