            <p id="loaderText" class="text-sm text-zinc-400">Searching Archive.org for curated 1976–1989 catalog...</p>
        </div>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Video Modal / Player -->
    <div id="player" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="stage" class="relative w-full max-w-5xl aspect-video bg-black flex items-center justify-center">
            <video id="video" class="w-full h-full" controls autoplay></video>
        </div>

            { title: "The Times of Harvey Milk", year: "1984", genre: "Documentary" }

        let activeItems = [];
        let currentGenre = 'all';

        async function fetchCuratedArchive() {
            try {
                document.getElementById('loaderText').innerText = `Targeting ${curatedList.length} curated movies on Archive.org...`;
                
                // Batch-query archive search API concurrently for each movie title
                const promises = curatedList.map(async (movie) => {
                    const cleanQuery = encodeURIComponent(`${movie.title} ${movie.year}`);
                    const url = `https://archive.org/advancedsearch.php?q=title:(${cleanQuery})+AND+mediatype:movies&fl[]=identifier&fl[]=title&fl[]=year&rows=1&output=json`;
                    
                    try {
                        const res = await fetch(url);
                        const json = await res.json();
                        const docs = json.response.docs;
                        if (docs && docs.length > 0) {
                            const match = docs[0];
                            return {
                                id: match.identifier,
                                title: movie.title,
                                year: movie.year,
                                genre: movie.genre,
                                category: 'movies',
                                video: `https://archive.org/download/${match.identifier}/${match.identifier}.mp4`
                            };
                        }
                    } catch (e) {
                        // Skip individual fetch errors
                    }
                    return null;
                });

                const results = await Promise.all(promises);
                activeItems = results.filter(item => item !== null);

                document.getElementById('loader').style.display = 'none';
                document.getElementById('statusBadge').innerText = `${activeItems.length} / ${curatedList.length} Verified Streams Loaded`;
                renderGrid(activeItems);

            } catch (error) {
                console.error("Discovery error:", error);
                document.getElementById('loader').innerHTML = '<p class="text-rose-500 text-sm">Failed to query curated list from Archive.org.</p>';
                document.getElementById('statusBadge').innerText = 'Index Error';
            }
        }

        function filterGenre(genre) {
            currentGenre = genre;
            
            // Update button styles
            document.querySelectorAll('.genre-btn').forEach(btn => {
                if(btn.innerText.includes(genre) || (genre === 'all' && btn.innerText === 'All Genres')) {
                    btn.className = "genre-btn px-3 py-1.5 rounded bg-amber-500 text-black font-semibold transition";
                } else {
                    btn.className = "genre-btn px-3 py-1.5 rounded bg-zinc-900 text-zinc-300 hover:bg-zinc-800 transition";
                }
            });

            if (genre === 'all') {
                renderGrid(activeItems);
            } else {
                renderGrid(activeItems.filter(item => item.genre === genre));
            }
        }

        function renderGrid(items) {
            const gridEl = document.getElementById('grid');
            if(items.length === 0) {
                gridEl.innerHTML = '<p class="text-zinc-500 col-span-full text-center py-10">No matching movies found in this view.</p>';
                return;
            }
            gridEl.innerHTML = items.map((item) => {
                // Find actual array index in activeItems
                const globalIndex = activeItems.findIndex(i => i.id === item.id);
                return `
                    <div onclick="openPlayer(${globalIndex})" class="bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden cursor-pointer hover:border-amber-500 transition group flex flex-col justify-between">
                        <div class="aspect-video bg-zinc-950 flex items-center justify-center relative overflow-hidden">
                            <img src="https://archive.org/services/img/${item.id}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300x169?text=NEXUS+TV'">
                            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                                <span class="px-4 py-2 bg-amber-500 text-black font-bold rounded text-xs shadow-lg">Play Stream</span>
                            </div>
                        </div>
                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <div>
                                <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-zinc-800 text-amber-400 rounded">${item.genre}</span>
                                <h4 class="font-semibold text-sm mt-2 line-clamp-2 text-zinc-100">${item.title}</h4>
                            </div>
                            <p class="text-xs text-zinc-400 mt-3">${item.year} · Archive Stream</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        const playerEl = document.getElementById('player');
        const videoEl = document.getElementById('video');

        function openPlayer(index){
            const f = activeItems[index];
            if(!f) return;
            playerEl.style.display = 'flex';
            setTimeout(() => playerEl.classList.add('opacity-100'), 10);
            document.getElementById('pTitle').innerText = `${f.title} (${f.year})`;
            document.getElementById('pMeta').innerText = `${f.genre} · Curated Stream`;
            videoEl.src = f.video;
            videoEl.load();
            videoEl.play().catch(err => console.log("Playback prevented:", err));
        }

        function closePlayer(){
            videoEl.pause();
            videoEl.src = "";
            playerEl.classList.remove('opacity-100');
            setTimeout(() => playerEl.style.display = 'none', 300);
        }

        document.getElementById('closeBtn').onclick = closePlayer;

        // Run targeted indexing on startup
        fetchCuratedArchive();
