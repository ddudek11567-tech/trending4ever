
<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS TV - IPTV & Cinema Suite</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HLS.js for m3u8 stream playback -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* Custom scrollbar for channel/movie lists */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }
    </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans selection:bg-red-600 selection:text-white">

    <!-- Top Header -->
    <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur px-6 py-4 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center space-x-3">
            <div class="bg-red-600 text-white font-black px-3 py-1 rounded tracking-wider text-lg shadow-lg shadow-red-600/30">
                NEXUS TV
            </div>
            <span class="text-xs text-slate-400 font-medium uppercase tracking-widest hidden sm:inline">
                IPTV & Cinema Suite
            </span>
        </div>
        <div class="text-xs text-slate-400 font-semibold tracking-wide">
            Webpage Designed by: Daniel Dudek
        </div>
    </header>

    <!-- Main Content Dashboard -->
    <main class="flex-1 flex flex-col lg:flex-row max-w-7xl w-full mx-auto p-4 gap-6 my-auto">
        
        <!-- Left: Video Player Section -->
        <div class="flex-1 flex flex-col">
            <div class="relative aspect-video bg-black rounded-xl overflow-hidden shadow-2xl border border-slate-800">
                <video
                    id="videoPlayer"
                    controls
                    autoplay
                    playsinline
                    class="w-full h-full object-contain"
                ></video>
            </div>
            <div class="mt-3 px-1 flex items-center justify-between">
                <div>
                    <h2 id="currentTitleDisplay" class="text-xl font-bold text-white tracking-tight">SYFY</h2>
                    <p class="text-xs text-emerald-400 font-medium mt-0.5">● Live Stream Active</p>
                </div>
            </div>
        </div>

        <!-- Right: Channel & Movie Selector Sidebar -->
        <div class="w-full lg:w-96 flex flex-col bg-slate-900/80 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
            <!-- Tabs -->
            <div class="flex border-b border-slate-800 bg-slate-900">
                <button
                    onclick="switchTab('channels')"
                    id="tabChannels"
                    class="flex-1 py-3 text-sm font-semibold tracking-wide transition-colors bg-red-600/10 text-red-500 border-b-2 border-red-500"
                >
                    Live Channels (<span id="channelCount">0</span>)
                </button>
                <button
                    onclick="switchTab('movies')"
                    id="tabMovies"
                    class="flex-1 py-3 text-sm font-semibold tracking-wide transition-colors text-slate-400 hover:text-slate-200"
                >
                    Movies Archive (<span id="movieCount">0</span>)
                </button>
            </div>

            <!-- List Items -->
            <div id="mediaList" class="p-3 overflow-y-auto max-h-[420px] space-y-2 custom-scrollbar">
                <!-- Populated dynamically via script -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="mt-auto py-6 border-t border-slate-900 text-center text-xs text-slate-500">
        NEXUS TV Engine &bull; Webpage Designed by: Daniel Dudek
    </footer>

    <!-- Application Script -->
    <script>
        // Live Channels Dataset
        const channels = [
            { name: "SYFY", category: "Entertainment", res: "1080p", url: "https://gpuserver5.tier1streams.com/SYFY/index.m3u8" },
            { name: "Hallmark Movies", category: "Entertainment", res: "1080p", url: "https://dbrb49pjoymg4.cloudfront.net/v1/master/3fec3e5cac39a52b2132f9c66c83dae043dc17d4/prod_default_xumo-ams-aws/master.m3u8?ads.xumo_channelId=99991709" },
            { name: "Xumo Movies", category: "Entertainment", res: "1080p", url: "https://dbrb49pjoymg4.cloudfront.net/v1/master/3fec3e5cac39a52b2132f9c66c83dae043dc17d4/prod_default_xumo-ams-aws/master.m3u8?ads.xumo_channelId=99991709" },
            { name: "A&E", category: "Entertainment", res: "1080p", url: "https://gpuserver3.tier1streams.com/AE/index.m3u8" },
            { name: "AMC Thrillers", category: "Movies", res: "1080p", url: "https://amg01265-amg01265c1-samsungus-3755.playouts.now.amagi.tv/playlist/amg01265-amg01265c1-samsungus-3755/playlist.m3u8" },
            { name: "Pluto TV Movies", category: "Movies", res: "1080p", url: "https://jmp2.uk/plu-5c8e31bfa82e873998f86f78.m3u8" },
            { name: "Action Movies", category: "Movies", res: "1080p", url: "https://rakuten-action-1-eu.rakuten.tv/v1/master/01509938b813b194fb8479e39f37c4d5/master.m3u8" },
            { name: "Comedy Movies", category: "Movies", res: "1080p", url: "https://rakuten-comedy-1-eu.rakuten.tv/v1/master/5d992d9f485f3bc7a7d4dfbf1e626e95/master.m3u8" },
            { name: "ESPN", category: "Sports", res: "720p", url: "https://gpuserver5.tier1streams.com/ESPN/index.m3u8" },
            { name: "Fox Sports 1", category: "Sports", res: "720p", url: "https://gpuserver5.tier1streams.com/FS1/index.m3u8" },
            { name: "Fox News", category: "News", res: "720p", url: "https://fox-foxnews-samsungus.amagi.tv/playlist.m3u8" },
            { name: "NASA TV", category: "Documentary", res: "1080p", url: "https://nasa-i.akamaihd.net/hls/live/508565/NASA-TV-HD/master.m3u8" }
        ];

        // Movies Archive Dataset
        const movies = [
            { title: "Big Buck Bunny (Animation)", year: "2008", url: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8" },
            { title: "Sintel (Fantasy Epic)", year: "2010", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
            { title: "Tears of Steel (Sci-Fi)", year: "2012", url: "https://demo.unified-streaming.com/k8s/features/stable/video/tears-of-steel/tears-of-steel.ism/.m3u8" }
        ];

        let currentTab = 'channels';
        let currentStream = channels[0].url;
        let currentTitle = channels[0].name;
        let hlsInstance = null;

        const videoElement = document.getElementById('videoPlayer');
        const titleDisplay = document.getElementById('currentTitleDisplay');
        const mediaListContainer = document.getElementById('mediaList');

        document.getElementById('channelCount').innerText = channels.length;
        document.getElementById('movieCount').innerText = movies.length;

        function switchTab(tab) {
            currentTab = tab;
            const tabChannels = document.getElementById('tabChannels');
            const tabMovies = document.getElementById('tabMovies');

            if (tab === 'channels') {
                tabChannels.className = "flex-1 py-3 text-sm font-semibold tracking-wide transition-colors bg-red-600/10 text-red-500 border-b-2 border-red-500";
                tabMovies.className = "flex-1 py-3 text-sm font-semibold tracking-wide transition-colors text-slate-400 hover:text-slate-200";
            } else {
                tabMovies.className = "flex-1 py-3 text-sm font-semibold tracking-wide transition-colors bg-red-600/10 text-red-500 border-b-2 border-red-500";
                tabChannels.className = "flex-1 py-3 text-sm font-semibold tracking-wide transition-colors text-slate-400 hover:text-slate-200";
            }
            renderList();
        }

        function renderList() {
            mediaListContainer.innerHTML = '';
            const dataset = currentTab === 'channels' ? channels : movies;

            dataset.forEach((item) => {
                const name = item.name || item.title;
                const isSelected = currentTitle === name;
                
                const btn = document.createElement('button');
                btn.onclick = () => selectMedia(item);
                btn.className = `w-full text-left p-3 rounded-lg border transition-all flex items-center justify-between ${
                    isSelected
                        ? 'bg-red-600/20 border-red-500 text-white shadow-md'
                        : 'bg-slate-800/40 border-slate-800 text-slate-300 hover:bg-slate-800 hover:border-slate-700'
                }`;

                if (currentTab === 'channels') {
                    btn.innerHTML = `
                        <div>
                            <div class="font-semibold text-sm">${item.name}</div>
                            <div class="text-xs text-slate-400 mt-0.5">${item.category}</div>
                        </div>
                        <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-slate-800 text-slate-300 border border-slate-700">
                            ${item.res}
                        </span>
                    `;
                } else {
                    btn.innerHTML = `
                        <div>
                            <div class="font-semibold text-sm">${item.title}</div>
                            <div class="text-xs text-slate-400 mt-0.5">Release Year: ${item.year}</div>
                        </div>
                        <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded bg-red-950 text-red-300 border border-red-800">
                            VOD
                        </span>
                    `;
                }
                mediaListContainer.appendChild(btn);
            });
        }

        function selectMedia(item) {
            currentStream = item.url;
            currentTitle = item.name || item.title;
            titleDisplay.innerText = currentTitle;
            renderList();
            loadStream();
        }

        function loadStream() {
            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (currentStream.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(currentStream);
                    hlsInstance.attachMedia(videoElement);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        videoElement.play().catch(() => {});
                    });
                } else if (videoElement.canPlayType('application/vnd.apple.mpegurl')) {
                    videoElement.src = currentStream;
                    videoElement.addEventListener('loadedmetadata', () => {
                        videoElement.play().catch(() => {});
                    });
                }
            } else {
                videoElement.src = currentStream;
                videoElement.play().catch(() => {});
            }
        }

        // Initialize application on load
        renderList();
        loadStream();
    </script>
</body>
