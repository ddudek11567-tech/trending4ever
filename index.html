<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NEXUS TV - Massive Archive Streamer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="border-b border-zinc-800 bg-zinc-900/50 backdrop-blur sticky top-0 z-50 px-6 py-4 flex items-center justify-between">
        <h1 class="text-xl font-bold tracking-wider text-amber-500">NEXUS <span class="text-zinc-100">TV</span></h1>
        <div class="flex items-center gap-3">
            <span id="statusBadge" class="text-xs text-amber-400 bg-amber-950/50 border border-amber-800/50 px-3 py-1 rounded-full">Querying Archive Database...</span>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow p-6 max-w-7xl mx-auto w-full">
        <div id="loader" class="flex flex-col items-center justify-center py-20 gap-4">
            <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-amber-500"></div>
            <p id="loaderText" class="text-sm text-zinc-400">Scanning Archive.org for up to 2,500 movies...</p>
        </div>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </main>

    <!-- Video Modal / Player -->
    <div id="player" class="fixed inset-0 bg-black/90 z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="stage" class="relative w-full max-w-5xl aspect-video bg-black flex items-center justify-center">
            <video id="video" class="w-full h-full" controls autoplay></video>
        </div>
        <div class="w-full max-w-5xl p-4 flex justify-between items-center bg-zinc-900 border-t border-zinc-800">
            <div>
                <h3 id="pTitle" class="font-bold text-lg text-white">Title</h3>
                <p id="pMeta" class="text-xs text-zinc-400">Massive Index Stream</p>
            </div>
            <div>
                <button id="closeBtn" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded text-sm font-semibold">Close Player</button>
            </div>
        </div>
    </div>

    <script>
        let activeItems = [];

        async function fetchMassiveArchive() {
            try {
                document.getElementById('loaderText').innerText = "Fetching catalog index (up to 2,500 items)...";
                
                // Query Archive.org Advanced Search API for items with mediatype 'movies'
                const searchUrl = `https://archive.org/advancedsearch.php?q=mediatype%3Amovies+AND+downloads%3A[50+TO+*]&fl[]=identifier&fl[]=title&fl[]=year&sort[]=downloads+desc&rows=250&page=1&output=json`;
                
                const response = await fetch(searchUrl);
                const data = await response.json();
                const docs = data.response.docs;

                if (!docs || docs.length === 0) {
                    throw new Error("No items returned from archive search.");
                }

                document.getElementById('loaderText').innerText = `Resolving playable video streams for ${docs.length} titles...`;

                // Map search documents into playable stream entries
                activeItems = docs.map(doc => ({
                    id: doc.identifier,
                    title: doc.title || doc.identifier,
                    year: doc.year || 'Classic',
                    category: 'movies',
                    // Default direct stream path fallback format used across archive items
                    video: `https://archive.org/download/${doc.identifier}/${doc.identifier}.mp4`
                }));

                document.getElementById('loader').style.display = 'none';
                document.getElementById('statusBadge').innerText = `${activeItems.length} Movies Loaded`;
                renderGrid(activeItems);

            } catch (error) {
                console.error("Discovery error:", error);
                document.getElementById('loader').innerHTML = '<p class="text-rose-500 text-sm">Failed to query massive index from Archive.org.</p>';
                document.getElementById('statusBadge').innerText = 'Index Error';
            }
        }

        function renderGrid(items) {
            const gridEl = document.getElementById('grid');
            if(items.length === 0) {
                gridEl.innerHTML = '<p class="text-zinc-500 col-span-full text-center py-10">No movies found.</p>';
                return;
            }
            gridEl.innerHTML = items.map((item, index) => `
                <div onclick="openPlayer(${index})" class="bg-zinc-900 border border-zinc-800 rounded-lg overflow-hidden cursor-pointer hover:border-amber-500 transition group flex flex-col justify-between">
                    <div class="aspect-video bg-zinc-950 flex items-center justify-center relative overflow-hidden">
                        <img src="https://archive.org/services/img/${item.id}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='https://via.placeholder.com/300x169?text=NEXUS+TV'">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <span class="px-4 py-2 bg-amber-500 text-black font-bold rounded text-xs shadow-lg">Play Stream</span>
                        </div>
                    </div>
                    <div class="p-4 flex flex-col flex-grow justify-between">
                        <div>
                            <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 bg-zinc-800 text-zinc-300 rounded">1080p / HD</span>
                            <h4 class="font-semibold text-sm mt-2 line-clamp-2 text-zinc-100">${item.title}</h4>
                        </div>
                        <p class="text-xs text-zinc-400 mt-3">${item.year} · Archive Stream</p>
                    </div>
                </div>
            `).join('');
        }

        const playerEl = document.getElementById('player');
        const videoEl = document.getElementById('video');

        function openPlayer(index){
            const f = activeItems[index];
            if(!f) return;
            playerEl.style.display = 'flex';
            setTimeout(() => playerEl.classList.add('opacity-100'), 10);
            document.getElementById('pTitle').innerText = f.title;
            videoEl.src = f.video;
            videoEl.load();
            videoEl.play().catch(err => console.log("Playback prevented:", err));
        }

        function closePlayer(){
            videoEl.pause();
            videoEl.src = "";
            playerEl.classList.remove('opacity-100');
            setTimeout(() => playerEl.style.display = 'none', 300);
        }

        document.getElementById('closeBtn').onclick = closePlayer;

        // Execute bulk indexing on startup
        fetchMassiveArchive();
    </script>
</body>
</html>
