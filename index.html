<!DOCTYPE html>
<html lang="en" class="dark">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- HLS.js for streaming support -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- FontAwesome for professional icons/logos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #111827;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <header class="bg-gray-900 border-b border-gray-800 h-16 flex items-center justify-between px-6 shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-brand-600 p-2 rounded-lg text-white shadow-lg shadow-brand-900/30">

            </div>
            <div>
                <span class="text-xl font-black tracking-wider bg-gradient-to-r from-white via-gray-200 to-brand-500 bg-clip-text text-transparent">NEXUS TV</span>
                <span class="text-xs block text-brand-500 font-semibold tracking-widest uppercase">Live Stream Suite</span>
            </div>
        </div>

        <div class="flex-1 max-w-md mx-8">

                <input type="text" id="channelSearch" placeholder="Search filtered channels or categories..."

            </div>
        </div>

        <div class="flex items-center space-x-4">
            <div class="text-xs bg-gray-800 px-3 py-1.5 rounded-full border border-gray-700 text-gray-300 flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                <span id="activeChannelCount">Loading Channels...</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace Layout -->
    <div class="flex-1 flex overflow-hidden">

        <!-- Left Column: Video Player & Stream Info -->
        <div class="flex-1 flex flex-col bg-gray-950 border-r border-gray-800 overflow-y-auto custom-scrollbar">
            <!-- Player Container -->
            <div class="relative w-full bg-black aspect-video shadow-2xl flex items-center justify-center shrink-0 group">
                <!-- Video Element -->
                <video id="videoPlayer" class="w-full h-full object-contain" controls autoplay playsinline></video>
                
                <!-- Player Overlay / Placeholder (Shown initially) -->
                <div id="playerPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900/90 text-center p-6 transition-opacity duration-300">
                    <div class="w-16 h-16 rounded-full bg-brand-600/20 border border-brand-500/40 flex items-center justify-center text-brand-400 mb-4 text-2xl shadow-inner">
                        <i class="fa-solid fa-play ml-1"></i>
                    </div>
                    <h3 class="text-lg font-bold text-white mb-1">Select a Channel to Start Playing</h3>
                    <p class="text-sm text-gray-400 max-w-sm">Choose any stream from the filtered playlist selector on the right.</p>
                </div>
            </div>

            <!-- Current Playing Meta Details -->
            <div class="p-6 bg-gray-900/50 border-t border-gray-800 flex flex-col space-y-4">
                <div class="flex items-start justify-between">
                    <div>
                        <div class="flex items-center space-x-2 mb-1">
                            <span id="currentCategoryBadge" class="text-[10px] font-bold uppercase tracking-wider bg-brand-600/20 text-brand-400 px-2.5 py-0.5 rounded border border-brand-500/30">Live Stream</span>
                            <span id="currentResolutionBadge" class="text-[10px] font-bold uppercase tracking-wider bg-gray-800 text-gray-300 px-2 py-0.5 rounded border border-gray-700">HD</span>
                        </div>
                        <h1 id="currentChannelTitle" class="text-2xl font-black text-white tracking-tight">No Channel Selected</h1>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="reloadStream()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center space-x-1.5 transition-colors border border-gray-700">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>Reload Stream</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Filtered Channel Directory & Playlist Selector -->
        <div class="w-96 bg-gray-900 flex flex-col shrink-0 border-l border-gray-800">
            <!-- Category Tabs -->
            <div class="p-4 border-b border-gray-800 bg-gray-900/80 backdrop-blur">
                <h2 class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-3 flex items-center justify-between">
                    <span>Channel Directory</span>
                    <span class="text-brand-500 font-mono text-[11px]" id="listCounter">0 Channels</span>
                </h2>
                <div class="flex space-x-1.5 overflow-x-auto pb-1 custom-scrollbar">
                    <button onclick="filterCategory('all')" class="cat-btn active px-3 py-1.5 rounded-md text-xs font-semibold bg-brand-600 text-white shrink-0 transition-all">All</button>
                    <button onclick="filterCategory('A&E')" class="cat-btn px-3 py-1.5 rounded-md text-xs font-semibold bg-gray-800 text-gray-400 hover:text-white shrink-0 transition-all">A&E</button>
                    <button onclick="filterCategory('ABC')" class="cat-btn px-3 py-1.5 rounded-md text-xs font-semibold bg-gray-800 text-gray-400 hover:text-white shrink-0 transition-all">ABC</button>
                    <button onclick="filterCategory('AMC')" class="cat-btn px-3 py-1.5 rounded-md text-xs font-semibold bg-gray-800 text-gray-400 hover:text-white shrink-0 transition-all">AMC</button>
                    <button onclick="filterCategory('AXN')" class="cat-btn px-3 py-1.5 rounded-md text-xs font-semibold bg-gray-800 text-gray-400 hover:text-white shrink-0 transition-all">AXN</button>
                    <button onclick="filterCategory('BBC')" class="cat-btn px-3 py-1.5 rounded-md text-xs font-semibold bg-gray-800 text-gray-400 hover:text-white shrink-0 transition-all">BBC</button>
                </div>
            </div>

            <!-- Channel Cards List Container -->
            <div id="channelListContainer" class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                <!-- Populated dynamically by JavaScript -->
            </div>
        </div>

    </div>

    <!-- Application Script Logic -->

            {

            },
            {
                name: "AMC Plus",
                category: "AMC",

            },
            // AXN Channels
            {
                name: "AXN HD",
                category: "AXN",
                resolution: "720p",

                icon: "fa-ticket",

            },
            {
                name: "AXN Asia Taiwan",
                category: "AXN",
                resolution: "720p",
                url: "https://play.wenxiang.cn/live/1a88465f153e1dd2108fd791bf4f25f7.flv",
                icon: "fa-earth-asia",
                color: "bg-amber-500/10 text-amber-400 border-amber-500/20"
            },
            {
                name: "AXN Latin America",
                category: "AXN",
                resolution: "1080p",
                url: "http://138.121.15.230:9002/AXN/index.m3u8",
                icon: "fa-globe-americas",
                color: "bg-amber-500/10 text-amber-400 border-amber-500/20"
            },
            // BBC Channels
            {
                name: "BBC America East",
                category: "BBC",
                resolution: "720p",
                url: "https://gpuserver3.tier1streams.com/BBC_AMERICA/index.m3u8",
                icon: "fa-landmark",
                color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20"
            },
            {
                name: "BBC News North America",
                category: "BBC",
                resolution: "1080p",
                url: "https://gpuserver3.tier1streams.com/BBC_WORLD_NEWS/index.m3u8",
                icon: "fa-globe",
                color: "bg-emerald-500/10 text-emerald-400 border-emerald-500/20"
            }
        ];

        let currentHls = null;
        let activeCategory = 'all';

        // Initialize App Interface
        document.addEventListener('DOMContentLoaded', () => {
            renderChannels(channels);
            updateCounters(channels.length);
            
            // Setup Search Listener
            document.getElementById('channelSearch').addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase();
                const filtered = channels.filter(ch => 
                    (activeCategory === 'all' || ch.category.toLowerCase() === activeCategory.toLowerCase()) &&
                    ch.name.toLowerCase().includes(query)
                );
                renderChannels(filtered);
            });
        });

        // Render channel cards with professional logos and icons
        function renderChannels(list) {
            const container = document.getElementById('channelListContainer');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-500 text-sm">No channels found</div>`;
                return;
            }

            list.forEach((ch, idx) => {
                const card = document.createElement('div');
                card.className = `group flex items-center justify-between p-3 rounded-xl bg-gray-950/40 border border-gray-800/80 hover:border-brand-500/50 hover:bg-gray-900 cursor-pointer transition-all`;
                card.onclick = () => playStream(ch);

                card.innerHTML = `
                    <div class="flex items-center space-x-3.5 min-w-0">
                        <div class="w-10 h-10 rounded-lg flex items-center justify-center border shrink-0 ${ch.color}">
                            <i class="fa-solid ${ch.icon} text-base"></i>
                        </div>
                        <div class="min-w-0">
                            <h4 class="text-sm font-bold text-gray-200 group-hover:text-white truncate">${ch.name}</h4>
                            <div class="flex items-center space-x-2 mt-0.5">
                                <span class="text-[10px] text-gray-400 uppercase tracking-wider">${ch.category}</span>
                                <span class="text-gray-600">•</span>
                                <span class="text-[10px] text-gray-500 font-mono">${ch.resolution}</span>
                            </div>
                        </div>
                    </div>
                    <div class="w-8 h-8 rounded-lg bg-gray-800/50 group-hover:bg-brand-600 text-gray-400 group-hover:text-white flex items-center justify-center shrink-0 transition-colors">
                        <i class="fa-solid fa-play text-xs ml-0.5"></i>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Play stream function with robust HLS handling
        let activeChannelUrl = '';
        let activeChannelName = '';
        let activeChannelRes = '';
        let activeChannelCategory = '';

        function playStream(ch) {
            activeChannelUrl = ch.url;
            activeChannelName = ch.name;
            activeChannelRes = ch.resolution;
            activeChannelCategory = ch.category;

            // Update UI Details
            document.getElementById('currentChannelTitle').innerText = ch.name;
            document.getElementById('currentResolutionBadge').innerText = ch.resolution;
            document.getElementById('currentCategoryBadge').innerText = ch.category;
            
            // Hide Placeholder
            document.getElementById('playerPlaceholder').classList.add('opacity-0', 'pointer-events-none');

            const video = document.getElementById('videoPlayer');

            if (currentHls) {
                currentHls.destroy();
            }

            if (Hls.isSupported()) {
                currentHls = new Hls();
                currentHls.loadSource(ch.url);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
                currentHls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        console.warn("HLS fatal error encountered, trying recovery...", data);
                        switch (data.type) {
                            case Hls.ErrorTypes.NETWORK_ERROR:
                                currentHls.startLoad();
                                break;
                            case Hls.ErrorTypes.MEDIA_ERROR:
                                currentHls.recoverMediaError();
                                break;
                            default:
                                currentHls.destroy();
                                break;
                        }
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = ch.url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(e => console.log("Autoplay blocked:", e));
                });
            }
        }

        function reloadStream() {
            if (activeChannelUrl) {
                playStream({
                    name: activeChannelName,
                    category: activeChannelCategory,
                    resolution: activeChannelRes,
                    url: activeChannelUrl,
                    icon: 'fa-tv',
                    color: 'bg-brand-500/10 text-brand-400 border-brand-500/20'
                });
            }
        }

        // Filter Categories Handler
        function filterCategory(cat) {
            activeCategory = cat;
            
            // Update active styling on buttons
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'text-white');
                btn.classList.add('bg-gray-800', 'text-gray-400');
            });
            event.target.classList.remove('bg-gray-800', 'text-gray-400');
            event.target.classList.add('bg-brand-600', 'text-white');

            const query = document.getElementById('channelSearch').value.toLowerCase();
            const filtered = channels.filter(ch => 
                (cat === 'all' || ch.category.toLowerCase() === cat.toLowerCase()) &&
                ch.name.toLowerCase().includes(query)
            );
            renderChannels(filtered);
            updateCounters(filtered.length);
        }

        function updateCounters(count) {
            document.getElementById('activeChannelCount').innerText = `${channels.length} Streams Active`;
            document.getElementById('listCounter').innerText = `${count} Channels`;
        }
    </script>
</body>
</html>
