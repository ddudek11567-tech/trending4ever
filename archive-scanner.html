<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Classic Movie & Series Streamer Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-slate-700 pb-4">
            <h1 class="text-2xl font-bold">Archive.org Master Stream Scanner</h1>
            <div id="status" class="text-sm bg-slate-800 px-4 py-2 rounded border border-slate-700">Ready to scan</div>
        </header>

        <div class="flex gap-4 mb-6">
            <button onclick="startScanning()" id="scanBtn" class="bg-emerald-600 hover:bg-emerald-500 font-semibold px-6 py-2 rounded transition">Start Scan</button>
            <button onclick="clearLocalStorage()" class="bg-rose-600 hover:bg-rose-500 font-semibold px-6 py-2 rounded transition">Clear Saved Data</button>
        </div>

        <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Discovered streams dynamically populate here -->
        </div>
    </div>

    <script>
        // Sample core validation array of titles to query against Archive.org API
        const masterMovieList = [
            "The Terminator", "Aliens", "Die Hard", "Matrix", "Gladiator", 
            "The Dark Knight", "Top Gun Maverick", "Inception", "Interstellar"
        ];

        async function queryArchiveOrg(movieTitle) {
            const url = `https://archive.org/advancedsearch.php?q=title:(${encodeURIComponent(movieTitle)}) AND mediatype:(movies)&fl[]=identifier,title,description&rows=1&output=json`;
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.response && data.response.docs.length > 0) {
                    return data.response.docs[0];
                }
            } catch (error) {
                console.error(`Error querying: ${movieTitle}`, error);
            }
            return null;
        }

        async function startScanning() {
            const statusEl = document.getElementById('status');
            const gridEl = document.getElementById('resultsGrid');
            const scanBtn = document.getElementById('scanBtn');
            
            scanBtn.disabled = true;
            let savedStreams = JSON.parse(localStorage.getItem('scanned_movies') || '[]');

            for (let i = 0; i < masterMovieList.length; i++) {
                let title = masterMovieList[i];
                statusEl.innerText = `Scanning (${i + 1}/${masterMovieList.length}): ${title}...`;

                // Check if already cached locally
                if (!savedStreams.some(s => s.title.toLowerCase() === title.toLowerCase())) {
                    let result = await queryArchiveOrg(title);
                    if (result) {
                        savedStreams.push({
                            title: result.title || title,
                            identifier: result.identifier,
                            embedUrl: `https://archive.org/embed/${result.identifier}`
                        });
                        localStorage.setItem('scanned_movies', JSON.stringify(savedStreams));
                        renderResults(savedStreams);
                    }
                }
                // Brief throttle pause to respect API limits
                await new Promise(r => setTimeout(r, 500));
            }

            statusEl.innerText = "Scan Complete!";
            scanBtn.disabled = false;
        }

        function renderResults(streams) {
            const gridEl = document.getElementById('resultsGrid');
            gridEl.innerHTML = streams.map(stream => `
                <div class="bg-slate-800 border border-slate-700 p-4 rounded shadow">
                    <h3 class="font-bold text-lg mb-2">${stream.title}</h3>
                    <div class="aspect-video bg-black mb-2">
                        <iframe src="${stream.embedUrl}" class="w-h-full w-full h-full" frameborder="0" webkitallowfullscreen mozallowfullscreen allowfullscreen></iframe>
                    </div>
                    <span class="text-xs text-slate-400">ID: ${stream.identifier}</span>
                </div>
            `).join('');
        }

        // Load cached results on page load
        window.onload = function() {
            let savedStreams = JSON.parse(localStorage.getItem('scanned_movies') || '[]');
            if (savedStreams.length > 0) {
                renderResults(savedStreams);
                document.getElementById('status').innerText = `Loaded ${savedStreams.length} cached streams.`;
            }
        };

        function clearLocalStorage() {
            localStorage.removeItem('scanned_movies');
            document.getElementById('resultsGrid').innerHTML = '';
            document.getElementById('status').innerText = "Storage cleared. Ready to scan.";
        }
    </script>
</body>
</html>
